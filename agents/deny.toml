#
# `cargo deny check licenses` for the agents/ workspace, the only place AGPL code may be linked
# (docs/oss/LICENSING.md §4.2, §7). Everything here is AGPL-3.0-or-later as a combined work; the
# model and rules it runs come from permissive crates in the root workspace.

[graph]
all-features = false

[licenses]
# Our own crates are `publish = false`; their licences are checked by tools/oss/spdx.py.
private = { ignore = true }
confidence-threshold = 0.9
# Permissive licences only. No copyleft licence is allowed here, not even a weak or file-level
# one: a copyleft crate is an exception below, by name, with its reason in docs/oss/LICENSING.md.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
exceptions = [
  # VOS (AGPL-3.0-or-later): agents/ only (tools/ci/check-no-vos.sh keeps it there).
  { allow = ["AGPL-3.0-or-later"], crate = "vos" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-agent-sdk" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-protocol" },
]

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
