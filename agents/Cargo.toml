# aledgent's VOS side (F-005): everything that links VOS, and nothing else.
#
# **Licensing.** VOS, including `vos-agent-sdk`, is AGPL-3.0-or-later; aledgent is Apache-2.0 OR MIT.
# Every crate here links VOS and is therefore AGPL-3.0-or-later, and this workspace is excluded
# from the root one, as `spikes/` is. Nothing outside `agents/` may depend on VOS or on anything
# here: `tools/ci/check-no-vos.sh` fails the build if a manifest outside `agents/` and `spikes/`
# names a VOS crate. The rest of aledgent reaches the core across a process boundary
# (`agents/core-host`, served over a local socket; `ingress::remote` is its client).
#
# | Crate | What | Toolchain |
# |---|---|---|
# | `core` | The Agent actor: `ledger-core` inside one VOS `saga` Local Agent (guest, `riscv64em-vos`). Its own workspace, as VOS's actors are | `nightly-2026-03-20` + `rust-src` |
# | `core-host` | The host process: the AgentRuntime driver (runtime ABI), the leaf store and witness path, and the server of `ingress::boundary::Core`'s four operations | the same |
#
# VOS is pinned to aledgent's fork, branch `stateful-program-upgrade`, commit `bd8d1bb7`: `perf/agent-stack`
# `c54fc1ff` (`saga/agents` at e6f2bb45 with aledgent's changes, proposals/vos/0001-0005 and 0006-0010:
# compact acknowledged results, actor-declared limits, programs loaded in place, the curve
# precompiles, the program hashed once, the runtime profiles, per-Agent execution limits) plus the
# stateful program change (T-037-19, owner ruling w5): a stateful actor's program changes in place on
# a claim its package's producer signs. TODO(F-025): move the pin to upstream `saga/agents` once the
# changes are merged there.
[workspace]
resolver = "2"
members = ["core-host"]
# The guest builds with its own toolchain and target (`vosx`'s actor scaffolding).
exclude = ["core", "shard"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/bloque-app/aledgent"
publish = false

[workspace.dependencies]
vos = { git = "https://codeberg.org/pandres95/VOS.git", rev = "bd8d1bb70551391a4c80a96c2249313ab7e0a0fc", default-features = false }
vos-pvm = { git = "https://codeberg.org/pandres95/VOS.git", rev = "bd8d1bb70551391a4c80a96c2249313ab7e0a0fc" }
vos-pvm-compiler = { git = "https://codeberg.org/pandres95/VOS.git", rev = "bd8d1bb70551391a4c80a96c2249313ab7e0a0fc" }

# CipherClerk e9a7b08 with proposals/cipherclerk/0001 (randomness as a parameter), made by
# tools/cipherclerk-patched.sh. The guest cannot build `signing` without it (getrandom).
# TODO(F-025): the upstream commit once 0001 is merged (T-025-07).
[patch."https://codeberg.org/Virto/CipherClerk.git"]
cipher-clerk = { path = "../.cipherclerk-patched" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"

[profile.release]
debug = "line-tables-only"
lto = "off"
codegen-units = 16

# Curve arithmetic and the PVM interpreter dominate; dependencies are optimised in test builds too.
[profile.dev.package."*"]
opt-level = 3
