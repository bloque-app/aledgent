#
# `cargo deny check licenses` for the root workspace (the `licensing` job of
# .github/workflows/ci.yml). The root workspace is aledgent's permissive side: the core's model and
# rules, the services and the tools. No copyleft dependency is allowed in it (docs/oss/LICENSING.md
# §7): AGPL code lives only in agents/ (its own deny.toml; tools/ci/check-no-vos.sh), and the
# settlement contract's GPL dependencies only in contracts/settlement (its own deny.toml). The one
# exception is a linking exception, which leaves the linking work under its own licence.

[graph]
all-features = false

[licenses]
# Our own crates are `publish = false`; their licences are checked by tools/oss/spdx.py.
private = { ignore = true }
confidence-threshold = 0.9
# Permissive licences only. No copyleft licence is allowed here, not even a weak or file-level
# one: a copyleft crate is an exception below, by name, with its reason in docs/oss/LICENSING.md.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
exceptions = [
  # The adapter's light client (services/settle): GPL with the Classpath exception, which allows
  # linking into an independent module under any licence (§4.1, §5).
  { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "smoldot" },
  { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "smoldot-light" },
]

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
