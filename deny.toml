#
# `cargo deny check licenses` (the `licensing` job of .github/workflows/ci.yml): every dependency's
# licence is on this list, and every copyleft one is an exception named here, with the reason in
# docs/oss/LICENSING.md §4. A new copyleft dependency fails the build until it is decided there.

[graph]
all-features = false

[licenses]
# Our own crates are `publish = false`; their licences are checked by tools/oss/spdx.py.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "CDLA-Permissive-2.0",
  # File-level copyleft, used unmodified (option-ext, webpki-roots, attohttpc).
  "MPL-2.0",
]
exceptions = [
  # The adapter's light client (services/settle): GPL with the Classpath exception (§4.1, §5).
  { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "smoldot" },
  { allow = ["GPL-3.0-or-later WITH Classpath-exception-2.0"], crate = "smoldot-light" },
  # agents/ only (tools/ci/check-no-vos.sh keeps them there).
  { allow = ["AGPL-3.0-or-later"], crate = "vos" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-agent-sdk" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-protocol" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-macros" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-pvm" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-pvm-compiler" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-pvm-program" },
  { allow = ["AGPL-3.0-or-later"], crate = "vos-pvm-precompiles" },
  # contracts/settlement through kreivo-apis: the built contract is GPL-3.0-only (§4.3).
  { allow = ["GPL-3.0-only"], crate = "kreivo-apis" },
  { allow = ["GPL-3.0-only"], crate = "virto-common" },
  { allow = ["GPL-3.0-only"], crate = "frame-contrib-traits" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-authn" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-authn-proc" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-gas-tank" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-listings" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-memberships" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-nonfungibles-helpers" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-payments" },
  { allow = ["GPL-3.0-only"], crate = "fc-traits-tracks" },
  { allow = ["GPL-3.0-only"], crate = "polkadot-core-primitives" },
  { allow = ["GPL-3.0-only"], crate = "polkadot-parachain-primitives" },
  { allow = ["GPL-3.0-only"], crate = "staging-xcm" },
  { allow = ["GPL-3.0-only"], crate = "staging-xcm-builder" },
  { allow = ["GPL-3.0-only"], crate = "staging-xcm-executor" },
  { allow = ["GPL-3.0-only"], crate = "xcm-procedural" },
]

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
