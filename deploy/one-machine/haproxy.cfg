#
# The local proxy of a one-machine deployment (DEC-27 (h′)): every request to whichever ingress
# instance is ready. An instance is checked on its readiness port (`readiness_listen`, GET /ready):
# 200 once it serves, 503 from the moment it drains. A release starts the second instance, waits
# until the proxy counts it up, then stops the first, which drains and leaves the rotation while it
# still answers what it took. An instance that is not running is resolved again every second and
# stays down until it is.

global
    log stdout format raw local0 warning

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 75s
    timeout server 75s
    # A request refused at connect (an instance gone between checks) goes to the other one.
    retries 2
    option redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold nx 1s
    hold obsolete 1s

frontend api
    bind :8080
    default_backend ingress

backend ingress
    option httpchk GET /ready
    http-check expect status 200
    default-server check port 8081 inter 1s fall 1 rise 2 resolvers docker init-addr none
    server blue ingress-blue:8080
    server green ingress-green:8080

# The proxy's own status, for the guide's release step: which instances are up.
frontend stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /stats
