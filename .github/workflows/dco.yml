name: DCO

# The Developer Certificate of Origin (CONTRIBUTING.md, "Sign-off"): every commit of a pull request
# carries a `Signed-off-by:` line naming its author. It runs only where the repository is public:
# the private companion's history predates the rule, and its pull requests are not contributions.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: $author' (git commit -s)"
              status=1
            fi
          done
          exit $status
