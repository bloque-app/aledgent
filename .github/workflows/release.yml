name: Release

# Releases and pre-releases (CONTRIBUTING.md, "Releases").
#
# main, releases (semver). release-please keeps one release pull request open against main
# (release-please-config.json): it bumps `[workspace.package] version` in Cargo.toml, the released
# members' entries in the lock files, and CHANGELOG.md, from the conventional-commit subjects merged
# since the last release (a squash merge's subject is its pull request's title, which
# .github/workflows/release-checks.yml requires to be conventional). Merging it tags `vX.Y.Z` and
# creates the GitHub release, marked latest. release-please acts as the GitHub App
# `aledgent-release`, so GitHub starts the release pull request's checks. Without the App's secrets
# it falls back to GITHUB_TOKEN, and GitHub starts no workflow for a pull request that token opened
# or updated: a warning says so, and a maintainer closes and reopens the release pull request to run
# its checks before merging it.
#
# develop, pre-releases. Every push tags `vX.Y.Z-dev+<sha7>` and creates a GitHub pre-release, never
# latest. X.Y.Z is the version the next release would have, computed as release-please computes it
# (tools/release/next-version.sh): a pre-release names the release it leads to.
#
# Either way, every image (.github/workflows/images.yml: ingress, settle, ops, signer, core,
# sidecar) is built and pushed to ghcr.io/bloque-app/aledgent-<name> as `sha-<commit>` and
# `v<version>` (`+` made `_`), and the release gets images.json. The one exception is a release whose
# source is a develop commit that already has a pre-release (bloque-app/bloque-ledgent#312, step 3):
# the job `promote` (tools/release/promote-images.py) takes that pre-release's core image by digest,
# tagging it `sha-<release commit>` and `v<version>`, and the core, the 17-minute job, is not built.
# It does so only when the release commit's tree is a develop commit's tree but for versions and the
# changelog (the rule of tools/ci/tested-tree.py), that commit's release.yml run succeeded and the
# core image's labels and tags agree with its images.json; otherwise, or on any error, every image is
# built as above. The other five are always built: ingress, settle and the sidecar report the crate
# version (ingress' and the sidecar's `/openapi.json` `info.version`, settle's network name), a
# release must report its own, and ops and signer, which do not, are compiled in the same job as
# ingress and settle, so taking them would save no time. A copy keeps the index and its buildx
# provenance attestation as the pre-release's build made them, and relabels nothing, so the promoted
# core's `org.opencontainers.image.version` and `.revision` labels name the pre-release and its
# commit; the tag and images.json (`promoted_from`) identify the release. Set the repository
# variable RELEASE_REBUILD to `true` to build every release's images as before.
#
#   {"version": "v0.2.0", "commit": "<40 hex>",
#    "images": {"ingress": "ghcr.io/bloque-app/aledgent-ingress@sha256:…", …}}
#
# `version` is the release's tag, as the dispatch names it (bloque-ledgent's deploy/bin/intake.sh
# fetches images.json from the release by that tag and checks that both agree).
#
# Then bloque-app/bloque-ledgent, the private deployment repository, gets a `repository_dispatch`
# (`aledgent-release` or `aledgent-prerelease`) whose payload is the tag, the commit and the SHA-256
# of images.json (`client_payload`: `version`, `commit`, `images_json_sha256`), under a token of the
# GitHub App `aledgent-release` (installed on bloque-ledgent for this, and on this repository for
# release-please above, each token limited to the one repository it is for), from the secrets
# ALEDGENT_RELEASE_APP_ID and ALEDGENT_RELEASE_APP_KEY of the environment `release`. Only main and
# develop may use that environment: nothing here runs on a tag, and a tag that anyone with write
# access can push must not reach the App's key (tools/release/protect-branches.sh removes the
# environment's `v*` tag policy). Without the secrets, the dispatch is skipped with a notice; the
# release stands.
#
# Never in a fork, and never on a pull request: this runs on pushes to main and develop only.

on:
  push:
    branches: [main, develop]

permissions: {}

# main: one run at a time, never cancelled (a release half-published is worse than a late one). A
# group keeps one pending run, so a queued run can be replaced by a newer one; release-please then
# creates the release in the newer run, and the images are built at the release's own commit (its
# `sha`), not at that run's. develop: one group per commit, so no push loses its pre-release.
concurrency:
  group: release-${{ github.ref }}${{ github.ref == 'refs/heads/develop' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release pull request (main)
    if: github.repository == 'bloque-app/aledgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # The release pull request's labels (`autorelease: pending`, `autorelease: tagged`).
      issues: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
      # The released commit: a run queued behind another may run at a later head of main.
      sha: ${{ steps.rp.outputs.sha }}
    # The App's credentials live in the `release` environment (main and develop only). A pull
    # request opened with the workflow's own token starts no workflow, so the release pull
    # request's required checks would never run (owner ruling v0w-release-please-token,
    # 2026-10-14): release-please acts as the aledgent-release App instead.
    environment: release
    env:
      HAS_APP: ${{ secrets.ALEDGENT_RELEASE_APP_ID != '' && secrets.ALEDGENT_RELEASE_APP_KEY != '' }}
    steps:
      - name: Release pull request without the App
        if: env.HAS_APP != 'true'
        run: |
          echo "::warning::ALEDGENT_RELEASE_APP_ID or ALEDGENT_RELEASE_APP_KEY is not set in the environment 'release': release-please falls back to GITHUB_TOKEN, and the release pull request it opens or updates will not start its checks (close and reopen it to run them)."
      - name: The aledgent-release App's token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ALEDGENT_RELEASE_APP_ID }}
          private-key: ${{ secrets.ALEDGENT_RELEASE_APP_KEY }}
          owner: bloque-app
          repositories: aledgent
          permission-contents: write
          # Pull requests write also covers the release pull request's labels
          # (`autorelease: pending`, `autorelease: tagged`); the App has no Issues
          # permission, and asking for one would fail the mint.
          permission-pull-requests: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Without the App (its secrets unset in the environment) the workflow's token still
          # works, and the step above warns: the release pull request then starts no checks.
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prerelease:
    name: pre-release version (develop)
    if: github.repository == 'bloque-app/aledgent' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every commit and tag: the last release and the subjects after it.
          fetch-depth: 0
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          next="$(tools/release/next-version.sh "$GITHUB_SHA")"
          version="$next-dev+${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Pre-release \`v$version\` (the next release: $next)" >> "$GITHUB_STEP_SUMMARY"

  # The release's images are the pre-release's, when its source is the release's (the header; the
  # script says why not, and never fails). Not a job that can hold the release up: `images` builds
  # unless this job says `promoted` (a crash here leaves that output empty, and the images are built).
  promote:
    name: promote the pre-release's images (main)
    needs: release-please
    if: >-
      github.repository == 'bloque-app/aledgent' && needs.release-please.outputs.created == 'true'
      && vars.RELEASE_REBUILD != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A tooling failure here (crane's download, say) builds the images and does not mark the run
    # failed: `images` keys off the `promoted` output, which a failed job leaves empty. The
    # script's tests run on every pull request (release-checks.yml), not here, to keep a hotfix's
    # release, which always builds, from waiting on them.
    continue-on-error: true
    permissions:
      contents: read
      # The release workflow's run on develop at the source commit is the evidence of a pre-release.
      actions: read
      packages: write
    env:
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      promoted_images: ${{ steps.promote.outputs.promoted_images }}
      reason: ${{ steps.promote.outputs.reason }}
      source_tag: ${{ steps.promote.outputs.source_tag }}
      source_commit: ${{ steps.promote.outputs.source_commit }}
      core: ${{ steps.promote.outputs.core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The released commit, and develop's history and tags below it.
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: crane
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf /tmp/crane.tar.gz -C "$RUNNER_TEMP/bin" crane
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.release-please.outputs.sha }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          python3 tools/release/promote-images.py --commit "$COMMIT" --version "$VERSION" --repository "$GITHUB_REPOSITORY" \
            | tee "$RUNNER_TEMP/promote.out"
          {
            echo "### Images"
            echo
            sed -n 's/^reason=//p' "$RUNNER_TEMP/promote.out"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: images
    needs: [release-please, prerelease, promote]
    # Always run: everything is built but the core, when `promote` took it.
    # `failure()` is not used: it would also skip the build when `promote` crashed, and a release
    # would get no images; a crashed `promote` leaves `promoted_images` empty, and everything is
    # built. An upstream failure still stops it.
    if: >-
      !cancelled() && needs.release-please.result != 'failure' && needs.prerelease.result != 'failure'
      && (needs.release-please.outputs.created == 'true' || needs.prerelease.outputs.version != '')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.version || needs.prerelease.outputs.version }}
      commit: ${{ needs.release-please.outputs.sha || github.sha }}
      promoted: ${{ needs.promote.outputs.promoted == 'true' && needs.promote.outputs.promoted_images || '' }}

  publish:
    name: images.json and dispatch
    needs: [release-please, prerelease, promote, images]
    if: >-
      !cancelled() && needs.release-please.result != 'failure' && needs.prerelease.result != 'failure'
      && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.prerelease.outputs.version != '' }}
      VERSION: ${{ needs.release-please.outputs.version || needs.prerelease.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag || needs.prerelease.outputs.tag }}
      COMMIT: ${{ needs.release-please.outputs.sha || github.sha }}
      HAS_APP: ${{ secrets.ALEDGENT_RELEASE_APP_ID != '' && secrets.ALEDGENT_RELEASE_APP_KEY != '' }}
      PROMOTED: ${{ needs.promote.outputs.promoted == 'true' }}
      PROMOTED_IMAGES: ${{ needs.promote.outputs.promoted == 'true' && needs.promote.outputs.promoted_images || '' }}
      SOURCE_TAG: ${{ needs.promote.outputs.source_tag }}
      SOURCE_COMMIT: ${{ needs.promote.outputs.source_commit }}
    steps:
      - name: images.json
        env:
          # Built here, except the core when it is promoted from a pre-release (`promote`'s output is
          # empty otherwise).
          INGRESS: ${{ needs.images.outputs.ingress }}
          SETTLE: ${{ needs.images.outputs.settle }}
          OPS: ${{ needs.images.outputs.ops }}
          SIGNER: ${{ needs.images.outputs.signer }}
          CORE: ${{ needs.promote.outputs.core || needs.images.outputs.core }}
          SIDECAR: ${{ needs.images.outputs.sidecar }}
        run: |
          set -euo pipefail
          for n in INGRESS SETTLE OPS SIGNER CORE SIDECAR; do
            ref="${!n}"
            # Every image, by digest, on the public registry.
            grep -Eq "^ghcr\.io/bloque-app/aledgent-${n,,}@sha256:[0-9a-f]{64}$" <<<"$ref" \
              || { echo "::error::no digest for ${n,,}: '$ref'"; exit 1; }
          done
          # `commit` is the release's, which the dispatch names. A promoted release adds, for each
          # image taken from a pre-release, where it came from (the intake reads `version`, `commit`
          # and `images` only).
          jq -n --arg version "$TAG" --arg commit "$COMMIT" \
                --arg ingress "$INGRESS" --arg settle "$SETTLE" --arg ops "$OPS" \
                --arg signer "$SIGNER" --arg core "$CORE" --arg sidecar "$SIDECAR" \
                --arg promoted "$PROMOTED_IMAGES" --arg stag "$SOURCE_TAG" --arg scommit "$SOURCE_COMMIT" \
            '{version: $version, commit: $commit,
              images: {ingress: $ingress, settle: $settle, ops: $ops, signer: $signer,
                       core: $core, sidecar: $sidecar}} as $doc
             | $doc + (if $promoted == "" then {} else
                 {promoted_from: ($promoted | split(" ") | map({key: ., value: {version: $stag, commit: $scommit, image: $doc.images[.]}}) | from_entries)}
               end)' > images.json
          cat images.json

      # Which images are the pre-release's, in the release's own notes (release-please wrote them).
      - name: Say so in the release notes
        if: env.PROMOTED == 'true' && env.PRERELEASE != 'true'
        # A note, not the release: a failed edit must not hold back images.json and the dispatch.
        continue-on-error: true
        run: |
          set -euo pipefail
          marker='<!-- images-promoted -->'
          gh release view "$TAG" --json body --jq .body > body.md
          if ! grep -qF "$marker" body.md; then
            {
              echo
              echo "$marker"
              echo "### Images"
              echo
              echo "Promoted, not rebuilt: the \`core\` image is that of the pre-release \`$SOURCE_TAG\` (commit \`$SOURCE_COMMIT\`), whose tree is this release's but for versions and the changelog; it reports no version. Its labels (\`org.opencontainers.image.version\`, \`.revision\`) name that pre-release. The other images were built for this release. images.json records \`promoted_from\`."
            } >> body.md
            gh release edit "$TAG" --notes-file body.md
          fi

      # A release exists already (release-please made it); a pre-release is made here, at the commit
      # its images were built from.
      - name: The pre-release
        if: env.PRERELEASE == 'true'
        run: |
          set -euo pipefail
          {
            echo "Pre-release of \`$COMMIT\` from \`develop\`, towards ${VERSION%%-*}. Not a release:"
            echo "its images are for test deployments. They are listed, by digest, in images.json."
          } > notes.md
          # A re-run (after making a package public, say) finds it made already.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --latest=false --notes-file notes.md
          else
            gh release create "$TAG" --target "$COMMIT" --prerelease --latest=false \
              --title "$TAG" --notes-file notes.md
          fi

      - name: Attach images.json
        id: asset
        run: |
          set -euo pipefail
          gh release upload "$TAG" images.json --clobber
          url="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "images.json") | .url')"
          test -n "$url"
          sha256="$(sha256sum images.json | cut -d' ' -f1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### $TAG"
            echo
            echo "images.json: $url (sha-256 \`$sha256\`)"
            echo
            echo '```json'
            cat images.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The images are public: anyone, bloque-ledgent included, pulls each digest with no
      # credential. A package GHCR created private (an org's default) stops the release here, before
      # a deployment is told of images it cannot pull: make the package public (its settings,
      # "Change visibility") and re-run this job.
      - name: Every image pulls anonymously
        run: |
          set -euo pipefail
          status=0
          for ref in $(jq -r '.images[]' images.json); do
            name="${ref#ghcr.io/}"; name="${name%@*}"; digest="${ref##*@}"
            # An anonymous token: GHCR refuses one for a private package, and the pull then fails.
            token="$(curl -sS "https://ghcr.io/token?scope=repository:$name:pull" | jq -r '.token // empty')"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/$name/manifests/$digest")"
            if [ "$code" = 200 ]; then
              echo "public: $ref"
            else
              echo "::error::$ref does not pull anonymously (HTTP $code): set ghcr.io/$name public"
              status=1
            fi
          done
          exit $status

      - name: No dispatch without the App
        if: env.HAS_APP != 'true'
        run: |
          echo "::notice::ALEDGENT_RELEASE_APP_ID or ALEDGENT_RELEASE_APP_KEY is not set in the environment 'release': bloque-app/bloque-ledgent is not notified of $TAG."
      - name: A token for bloque-ledgent
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ALEDGENT_RELEASE_APP_ID }}
          private-key: ${{ secrets.ALEDGENT_RELEASE_APP_KEY }}
          owner: bloque-app
          repositories: bloque-ledgent
          permission-contents: write
      - name: Dispatch to bloque-ledgent
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGES_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then event=aledgent-prerelease; else event=aledgent-release; fi
          # bloque-ledgent's contract (.github/workflows/release-intake.yml there): the tag, the
          # SHA-256 of images.json, which it fetches from the release by that tag, and the commit.
          jq -n --arg event "$event" --arg version "$TAG" --arg commit "$COMMIT" \
                --arg sha256 "$IMAGES_SHA256" \
            '{event_type: $event,
              client_payload: {version: $version, images_json_sha256: $sha256, commit: $commit}}' \
            | gh api --method POST repos/bloque-app/bloque-ledgent/dispatches --input -
          echo "Dispatched \`$event\` ($TAG) to bloque-app/bloque-ledgent" >> "$GITHUB_STEP_SUMMARY"
