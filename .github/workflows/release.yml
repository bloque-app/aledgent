name: Release

# Releases and pre-releases (CONTRIBUTING.md, "Releases").
#
# main, releases (semver). release-please keeps one release pull request open against main
# (release-please-config.json): it bumps `[workspace.package] version` in Cargo.toml, the released
# members' entries in the lock files, and CHANGELOG.md, from the conventional-commit subjects merged
# since the last release (a squash merge's subject is its pull request's title, which
# .github/workflows/release-checks.yml requires to be conventional). Merging it tags `vX.Y.Z` and
# creates the GitHub release, marked latest. GitHub starts no workflow for a pull request that
# GITHUB_TOKEN opened or updated, so a maintainer closes and reopens the release pull request to run
# its checks before merging it.
#
# develop, pre-releases. Every push tags `vX.Y.Z-dev+<sha7>` and creates a GitHub pre-release, never
# latest. X.Y.Z is the version the next release would have, computed as release-please computes it
# (tools/release/next-version.sh): a pre-release names the release it leads to.
#
# Either way, every image (.github/workflows/images.yml: ingress, settle, ops, signer, core,
# sidecar) is built and pushed to ghcr.io/bloque-app/aledgent-<name> as `sha-<commit>` and
# `v<version>` (`+` made `_`), and the release gets images.json:
#
#   {"version": "0.2.0", "tag": "v0.2.0", "commit": "<sha>", "prerelease": false,
#    "images": {"ingress": "ghcr.io/bloque-app/aledgent-ingress@sha256:…", …}}
#
# Then bloque-app/bloque-ledgent, the private deployment repository, gets a `repository_dispatch`
# (`aledgent-release` or `aledgent-prerelease`) whose payload is the version, the commit, the URL of
# images.json and its SHA-256 (`client_payload`: `version`, `commit`, `images_json_url`,
# `images_json_sha256`), under a token of the GitHub App `aledgent-release` (installed on that
# repository only), from the secrets ALEDGENT_RELEASE_APP_ID and ALEDGENT_RELEASE_APP_KEY of the
# environment `release` (branches main and develop, tags v*). Without them, the dispatch is skipped
# with a notice; the release stands.
#
# Never in a fork, and never on a pull request: this runs on pushes to main and develop only.

on:
  push:
    branches: [main, develop]

permissions: {}

# One run per branch at a time, never cancelled: a release half-published is worse than a late one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release pull request (main)
    if: github.repository == 'bloque-app/aledgent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prerelease:
    name: pre-release version (develop)
    if: github.repository == 'bloque-app/aledgent' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Every commit and tag: the last release and the subjects after it.
          fetch-depth: 0
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          next="$(tools/release/next-version.sh "$GITHUB_SHA")"
          version="$next-dev+${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Pre-release \`v$version\` (the next release: $next)" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: images
    needs: [release-please, prerelease]
    if: >-
      !cancelled() && !failure()
      && (needs.release-please.outputs.created == 'true' || needs.prerelease.outputs.version != '')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release-please.outputs.version || needs.prerelease.outputs.version }}

  publish:
    name: images.json and dispatch
    needs: [release-please, prerelease, images]
    if: >-
      !cancelled() && !failure() && needs.images.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRERELEASE: ${{ needs.prerelease.outputs.version != '' }}
      VERSION: ${{ needs.release-please.outputs.version || needs.prerelease.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag || needs.prerelease.outputs.tag }}
      HAS_APP: ${{ secrets.ALEDGENT_RELEASE_APP_ID != '' && secrets.ALEDGENT_RELEASE_APP_KEY != '' }}
    steps:
      - name: images.json
        env:
          INGRESS: ${{ needs.images.outputs.ingress }}
          SETTLE: ${{ needs.images.outputs.settle }}
          OPS: ${{ needs.images.outputs.ops }}
          SIGNER: ${{ needs.images.outputs.signer }}
          CORE: ${{ needs.images.outputs.core }}
          SIDECAR: ${{ needs.images.outputs.sidecar }}
        run: |
          set -euo pipefail
          for n in INGRESS SETTLE OPS SIGNER CORE SIDECAR; do
            ref="${!n}"
            # Every image, by digest, on the public registry.
            grep -Eq "^ghcr\.io/bloque-app/aledgent-${n,,}@sha256:[0-9a-f]{64}$" <<<"$ref" \
              || { echo "::error::no digest for ${n,,}: '$ref'"; exit 1; }
          done
          jq -n --arg version "$VERSION" --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
                --argjson prerelease "$PRERELEASE" \
                --arg ingress "$INGRESS" --arg settle "$SETTLE" --arg ops "$OPS" \
                --arg signer "$SIGNER" --arg core "$CORE" --arg sidecar "$SIDECAR" \
            '{version: $version, tag: $tag, commit: $commit, prerelease: $prerelease,
              images: {ingress: $ingress, settle: $settle, ops: $ops, signer: $signer,
                       core: $core, sidecar: $sidecar}}' > images.json
          cat images.json

      # A release exists already (release-please made it); a pre-release is made here, at the commit
      # its images were built from.
      - name: The pre-release
        if: env.PRERELEASE == 'true'
        run: |
          set -euo pipefail
          {
            echo "Pre-release of \`$GITHUB_SHA\` from \`develop\`, towards ${VERSION%%-*}. Not a release:"
            echo "its images are for test deployments. They are listed, by digest, in images.json."
          } > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "$TAG" --notes-file notes.md

      - name: Attach images.json
        id: asset
        run: |
          set -euo pipefail
          gh release upload "$TAG" images.json --clobber
          url="$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "images.json") | .url')"
          test -n "$url"
          sha256="$(sha256sum images.json | cut -d' ' -f1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### $TAG"
            echo
            echo "images.json: $url (sha-256 \`$sha256\`)"
            echo
            echo '```json'
            cat images.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No dispatch without the App
        if: env.HAS_APP != 'true'
        run: |
          echo "::notice::ALEDGENT_RELEASE_APP_ID or ALEDGENT_RELEASE_APP_KEY is not set in the environment 'release': bloque-app/bloque-ledgent is not notified of $TAG."
      - name: A token for bloque-ledgent
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ALEDGENT_RELEASE_APP_ID }}
          private-key: ${{ secrets.ALEDGENT_RELEASE_APP_KEY }}
          owner: bloque-app
          repositories: bloque-ledgent
          permission-contents: write
      - name: Dispatch to bloque-ledgent
        if: env.HAS_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          IMAGES_URL: ${{ steps.asset.outputs.url }}
          IMAGES_SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = true ]; then event=aledgent-prerelease; else event=aledgent-release; fi
          jq -n --arg event "$event" --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
                --arg url "$IMAGES_URL" --arg sha256 "$IMAGES_SHA256" \
            '{event_type: $event,
              client_payload: {version: $version, commit: $commit,
                               images_json_url: $url, images_json_sha256: $sha256}}' \
            | gh api --method POST repos/bloque-app/bloque-ledgent/dispatches --input -
          echo "Dispatched \`$event\` ($VERSION) to bloque-app/bloque-ledgent" >> "$GITHUB_STEP_SUMMARY"
