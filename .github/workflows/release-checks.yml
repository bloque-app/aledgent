name: Release checks

# What a release needs from every pull request (.github/workflows/release.yml, CONTRIBUTING.md
# "Releases"):
#
# - conventional PR title: the title is a Conventional Commits subject, `type(scope)!: summary`. A
#   squash merge's subject is the title, and release-please reads the subjects to choose the next
#   version and write the changelog. A required check.
# - release configuration: release-please-config.json still updates every released crate's version
#   in every lock file, and the guest programs' crates keep their fixed one
#   (tools/release/check-config.py).
# - semver (public API): cargo-semver-checks against the last release, for the crates whose API is
#   used from outside this workspace's own build: `verify` (a recipient's offline check of an anchor
#   and a disclosure, a library for third parties), `compact-smt` (the state commitment and its proofs,
#   which a verifier recomputes) and `ledger-core` (the identifiers, the asset registry and the closed
#   Refusal list every integration names). The services, the binaries, the test harnesses and the
#   crates only aledgent's own processes link are left out: their API is internal. The release type
#   checked is the one the release would have with this pull request merged (its title counted), as
#   tools/release/next-version.sh computes it, so a breaking change passes only under a title that
#   says so (`feat!:`, or a `BREAKING CHANGE:` footer in a commit already merged), or a `feat` before
#   1.0.0. Before 1.0.0, a minor release is the one that may break (Cargo's reading of 0.y.z), so
#   next-version.sh answers `major` for it, the release type at which cargo-semver-checks allows a
#   break: before 1.0.0 this job therefore refuses a breaking change only when the pending release is
#   a patch release. The versions released are unchanged (`--print version`).
#
# - image promotion: tools/release/promote-images.py (the release re-tags a develop pre-release's
#   images instead of building them: .github/workflows/release.yml, job `promote`) passes its own
#   tests, which run it against synthetic repositories and a fake registry, and a dry run of it for
#   the latest release, against the real history and registry, shows in the summary what a release
#   would do today (nothing is copied; the dry run informs and never fails the check).
#
# It reads the title, the code and the history; it holds no secret and writes nothing, so it runs
# on pull requests from forks as on any other.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The title is a Conventional Commits subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|refactor|revert|docs|test|build|ci|chore|style|deps'
          if grep -Eq "^($types)(\([a-z0-9][a-z0-9._/-]*\))?!?: [^ ](.*[^ ])?$" <<<"$TITLE"; then
            echo "conventional: $TITLE"
          else
            echo "::error::The title is the squash merge's subject, and release-please reads it: write it as 'type(scope)!: summary', with a type among ${types//|/, }, an optional lower-case scope, '!' for a breaking change (for example 'fix(ingress): refuse an empty client key'). It is: $TITLE"
            exit 1
          fi

  config:
    name: release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 tools/release/check-config.py

  semver:
    name: semver (public API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The last release's tag and the subjects since: the whole history.
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: semver
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-semver-checks@0.51.0
      - name: The release this pull request leads to
        id: release
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline="$(tools/release/next-version.sh --print baseline "$BASE")"
          type="$(tools/release/next-version.sh --print release-type --title "$TITLE" "$BASE")"
          next="$(tools/release/next-version.sh --title "$TITLE" "$BASE")"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "Checked against \`$baseline\` as a \`$type\` release (the next release: $next)" >> "$GITHUB_STEP_SUMMARY"
      - name: cargo semver-checks
        env:
          BASELINE: ${{ steps.release.outputs.baseline }}
          TYPE: ${{ steps.release.outputs.type }}
        run: >-
          cargo semver-checks check-release
          --package verify --package compact-smt --package ledger-core
          --baseline-rev "$BASELINE" --release-type "$TYPE" --default-features

  promotion:
    name: image promotion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      CRANE_VERSION: v0.22.1
      CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # develop's history and every tag: what the script walks.
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/release/test-promote-images.py
      - name: A dry run for the latest release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o /tmp/crane.tar.gz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf /tmp/crane.tar.gz -C "$RUNNER_TEMP/bin" crane
          export PATH="$RUNNER_TEMP/bin:$PATH"
          tag="$(git tag --list 'v[0-9]*' | grep -Ev -- '[-+]' | sort -V | tail -n 1)"
          if [ -z "$tag" ]; then echo "no release yet"; exit 0; fi
          # Never fails: a doubt is `promoted=false` and a reason.
          {
            echo "### Dry run: would \`$tag\` take a pre-release's images?"
            echo
            echo '```'
            python3 tools/release/promote-images.py --dry-run --commit "$(git rev-list -n 1 "$tag")" \
              --version "${tag#v}" --repository "$GITHUB_REPOSITORY"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
