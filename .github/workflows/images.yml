name: Images

# aledgent's container images (deploy/docker/), built here and nowhere else: never on a developer's
# machine, and never on a self-hosted runner. GitHub-hosted runners, linux/amd64. Every image is
# public, on GHCR (no other registry):
#
#   ghcr.io/bloque-app/aledgent-ingress   aledgent-ingress, with the in-process core
#   ghcr.io/bloque-app/aledgent-settle    the settlement adapter, with its chain specs
#   ghcr.io/bloque-app/aledgent-ops       opsctl: the signal exporter
#   ghcr.io/bloque-app/aledgent-signer    aledgent-signer: the key boundary (F-035)
#   ghcr.io/bloque-app/aledgent-core      the core as a VOS Agent (aledgent-core-host), AGPL-3.0-or-later
#   ghcr.io/bloque-app/aledgent-sidecar   aledgent for other repositories' CI (deploy/docker/SIDECAR.md)
#
# A pull request builds every image, runs each binary once inside it (a distroless image has no
# shell, so a binary that does not link fails here), checks the baked chain specs, and reports the
# sizes; it pushes nothing.
#
# A release or a pre-release (.github/workflows/release.yml) calls this workflow with its version:
# the same builds and checks, then every image pushed as `sha-<commit>` and `v<version>` (a
# pre-release's `+` becomes `_`, which a tag allows), labelled with the commit and the version
# (`org.opencontainers.image.revision`, `.version`). The workflow's outputs are each image's
# `ghcr.io/…@sha256:<digest>`, which the release records in its images.json. There is no moving tag
# but the sidecar's `edge`: a deployment pins a version or a digest, and a podman auto-update policy
# follows whatever tag the deployment chooses to move.
#
# A manual dispatch from `main` or `develop` builds and pushes `sha-<commit>` (for v1 roots, see
# below); from any other branch it builds and checks, and pushes nothing. A push to `main` (a
# merge) pushes the sidecar alone, as `sha-<commit>` and `edge`.
#
# The book's roots (DEC-25, owner ruling cs-q04): every image is built with v2 roots (compact trees),
# the default, unless a manual dispatch asks for `roots: v1` (CipherClerk's full-depth trees, a
# supported opt-in, chosen for a whole deployment at genesis). Then ingress, settle, ops and core are
# built with v1 (the Dockerfiles' ROOTS) and pushed as `sha-<commit>-roots-v1`, so a v1 image never
# takes a v2 image's tag; each image carries its roots as the label `app.aledgent.roots`. The sidecar
# is always v2.
#
# A core on a deployment's genesis bytes (F-038 §12 step 0, DEC-27 (i)): a manual dispatch with
# `genesis_image` (the deployment's pinned core image, `ghcr.io/bloque-app/aledgent-core@sha256:…`)
# and `genesis_manifest` (its genesis code manifest, `aledgent/code/v1`, in hex) builds nothing else:
# the job `core on genesis` builds the current `aledgent-core-host` with the package and the runtime
# copied from that image (core.Dockerfile, target `core-on-genesis`), and the build fails unless they
# are the manifest's (`aledgent-core-host check-code`), and its version `genesis_code` (required).
# The host takes the genesis image's roots (its label `app.aledgent.roots`; `roots` when it has
# none). From `main` or `develop` it is pushed as `host-<commit>-on-genesis-<the genesis digest's
# first 12 hex>` only, never `sha-<commit>`, so it cannot be taken for a core built from source.
# On a pull request the same job is the test: the current release's core image is the genesis
# (its manifest written by its own host's `code-manifest`), whose build must pass, and a copy of it
# with one byte of `core.vos` changed (in a registry on the runner), and a genesis named by tag,
# must each fail it. Without `genesis_image`, nothing above changes.

on:
  pull_request:
    paths:
      - "crates/**"
      - "services/**"
      - "ops/**"
      - "agents/**"
      - "e2e/aledgent-driver/**"
      - "e2e/sidecar/**"
      - "deploy/**"
      - "tools/cipherclerk-patched.sh"
      - "proposals/cipherclerk/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".dockerignore"
      - ".github/workflows/images.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      roots:
        description: "The book's roots (DEC-25): v2 (the default) or v1 (a supported opt-in, cs-q04)"
        type: choice
        options: [v2, v1]
        default: v2
      genesis_image:
        description: "Only a core on a deployment's genesis bytes (F-038 §12 step 0): its pinned core image, ghcr.io/…/aledgent-core@sha256:…"
        type: string
        default: ""
      genesis_manifest:
        description: "With genesis_image: the deployment's genesis code manifest (aledgent/code/v1), in hex"
        type: string
        default: ""
      genesis_code:
        description: "With genesis_image, required: the genesis code version H0 (64 hex, either case) the manifest must have"
        type: string
        default: ""
  workflow_call:
    inputs:
      version:
        description: "The release's or pre-release's version, without the v (0.2.0, 0.2.0-dev+abc1234)"
        type: string
        required: true
      commit:
        description: "The commit to build: the release's (release-please's `sha`); the event's by default"
        type: string
        required: false
        default: ""
    outputs:
      ingress:
        description: "ghcr.io/bloque-app/aledgent-ingress@sha256:…"
        value: ${{ jobs.services.outputs.ingress }}
      settle:
        description: "ghcr.io/bloque-app/aledgent-settle@sha256:…"
        value: ${{ jobs.services.outputs.settle }}
      ops:
        description: "ghcr.io/bloque-app/aledgent-ops@sha256:…"
        value: ${{ jobs.services.outputs.ops }}
      signer:
        description: "ghcr.io/bloque-app/aledgent-signer@sha256:…"
        value: ${{ jobs.services.outputs.signer }}
      core:
        description: "ghcr.io/bloque-app/aledgent-core@sha256:…"
        value: ${{ jobs.core.outputs.core }}
      sidecar:
        description: "ghcr.io/bloque-app/aledgent-sidecar@sha256:…"
        value: ${{ jobs.sidecar.outputs.sidecar }}

permissions:
  contents: read

# One group per event, ref and version: a pending dispatch on main is never replaced by a merge's
# push run (a group keeps one pending run, the newest), pushes to main still queue behind each other,
# and a release's call never waits on, or replaces, the sidecar's run for the same push.
concurrency:
  group: images-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # check (a pull request, or a dispatch from any other branch): build and test, push nothing.
  # release: called with a version. dispatch: from main or develop only, pushed as sha-<commit>, so
  # nothing reaches the public packages that has not been through a reviewed merge. edge: a push to
  # main, the sidecar alone.
  MODE: >-
    ${{ inputs.version != '' && 'release'
     || github.event_name == 'workflow_dispatch'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && 'dispatch'
     || github.event_name == 'push' && 'edge'
     || 'check' }}
  VERSION: ${{ inputs.version }}
  # The commit built, labelled and tagged: a release's own, which a run queued behind another may
  # no longer have as its event's commit.
  COMMIT: ${{ inputs.commit || github.sha }}
  # The roots of ingress, settle, ops and core, and their tags' suffix (cs-q04).
  ROOTS: ${{ inputs.roots == 'v1' && 'v1' || 'v2' }}
  ROOTS_TAG: ${{ inputs.roots == 'v1' && '-roots-v1' || '' }}
  # The labels every image carries; a release's adds its version.
  LABELS: |
    org.opencontainers.image.revision=${{ inputs.commit || github.sha }}
    org.opencontainers.image.source=https://github.com/bloque-app/aledgent
    ${{ inputs.version != '' && format('org.opencontainers.image.version={0}', inputs.version) || '' }}

jobs:
  services:
    name: ingress, settle, ops, signer
    # Pull requests, releases and dispatches; never a plain push to main (only the sidecar's), and
    # never a dispatch for a core on a genesis.
    if: (inputs.version != '' || github.event_name != 'push') && inputs.genesis_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      ingress: ${{ steps.pushed.outputs.ingress }}
      settle: ${{ steps.pushed.outputs.settle }}
      ops: ${{ steps.pushed.outputs.ops }}
      signer: ${{ steps.pushed.outputs.signer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One builder for the four targets: the Rust build stage is shared, so the workspace
      # compiles once. build-push-action hands the builder the Actions cache's credentials.
      - name: Build ingress
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: ingress
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          cache-to: type=gha,scope=services${{ env.ROOTS_TAG }},mode=max
          load: true
          tags: aledgent-ingress:ci
      - name: Build settle
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: settle
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          load: true
          tags: aledgent-settle:ci
      - name: Build ops
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: ops
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          load: true
          tags: aledgent-ops:ci
      # F-035: the key boundary.
      - name: Build signer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: signer
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          load: true
          tags: aledgent-signer:ci

      - name: Run each binary in its image
        run: |
          set -euo pipefail
          # ingress: the OpenAPI document needs no configuration.
          out=$(docker run --rm aledgent-ingress:ci openapi)
          grep -q '"openapi"' <<<"$out"
          # settle and opsctl: a missing configuration is refused by the binary itself.
          out=$(docker run --rm -e RUST_LOG=info aledgent-settle:ci /nonexistent/settle.json 2>&1 || true)
          echo "$out"
          grep -q '/nonexistent/settle.json' <<<"$out"
          out=$(docker run --rm aledgent-ops:ci no-such-command 2>&1 || true)
          echo "$out"
          grep -q 'usage: opsctl' <<<"$out"
          # signer: a missing configuration is refused, and it runs as its own user (F-035).
          out=$(docker run --rm aledgent-signer:ci serve /nonexistent/signer.json 2>&1 || true)
          echo "$out"
          grep -q '/nonexistent/signer.json' <<<"$out"
          test "$(docker image inspect -f '{{.Config.User}}' aledgent-signer:ci)" = "65533:65533"
          # Every image runs as the distroless nonroot user.
          for t in ingress settle ops; do
            test "$(docker image inspect -f '{{.Config.User}}' "aledgent-$t:ci")" = "65532:65532"
            # The roots it was built with (cs-q04).
            test "$(docker image inspect -f '{{index .Config.Labels "app.aledgent.roots"}}' "aledgent-$t:ci")" = "$ROOTS"
          done

      - name: The chain specs baked into aledgent-settle
        run: |
          set -euo pipefail
          id=$(docker create aledgent-settle:ci)
          docker cp "$id:/usr/share/aledgent/chain-specs" "$RUNNER_TEMP/specs"
          docker rm "$id" > /dev/null
          python3 - "$RUNNER_TEMP/specs" <<'EOF'
          import json, sys
          d = sys.argv[1]
          kreivo = json.load(open(f"{d}/kreivo.json"))
          kusama = json.load(open(f"{d}/kusama.json"))
          assert kreivo["para_id"] == 2281 and kreivo["relay_chain"] == kusama["id"] == "ksmcc3"
          # Kreivo's spec is kreivo-node's verified light spec, 12 boot nodes (item 24's single boot
          # node is lifted); Kusama's is still cut to one.
          assert len(kreivo["bootNodes"]) == 12 and len(kusama["bootNodes"]) == 1, "boot nodes"
          assert "lightSyncState" in kusama, "a checkpoint"
          print("kreivo:", kreivo["bootNodes"][0])
          print("kusama:", kusama["bootNodes"][0])
          EOF

      - name: Sizes
        run: |
          {
            echo "### Images (linux/amd64)"
            echo
            echo "| Image | Size |"
            echo "|---|---:|"
            for t in ingress settle ops signer; do
              size=$(docker image inspect -f '{{.Size}}' "aledgent-$t:ci")
              echo "| \`aledgent-$t\` | $((size / 1024 / 1024)) MiB ($size B) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # What to push: `sha-<commit>` (with the roots' suffix on a dispatch), and a release's
      # `v<version>`, `+` made `_`.
      - name: Tags
        id: meta
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        run: |
          set -euo pipefail
          for t in ingress settle ops signer; do
            repo="ghcr.io/bloque-app/aledgent-$t"
            case "$MODE" in
              release) echo "$t=$repo:sha-$COMMIT,$repo:v${VERSION//+/_}" ;;
              dispatch) echo "$t=$repo:sha-$COMMIT$ROOTS_TAG" ;;
              edge) echo "$t=$repo:sha-$COMMIT,$repo:edge" ;;
            esac
          done >> "$GITHUB_OUTPUT"

      # The same builds again, from the builder's cache, pushed.
      - name: Push ingress
        id: push-ingress
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: ingress
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.ingress }}
      - name: Push settle
        id: push-settle
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: settle
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.settle }}
      - name: Push ops
        id: push-ops
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: ops
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.ops }}
      - name: Push signer
        id: push-signer
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: signer
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=services${{ env.ROOTS_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.signer }}
      # Each image's digest, read back from the registry, and its reference with that digest: the
      # workflow's outputs.
      - name: Pushed
        id: pushed
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        env:
          INGRESS: ${{ steps.push-ingress.outputs.digest }}
          SETTLE: ${{ steps.push-settle.outputs.digest }}
          OPS: ${{ steps.push-ops.outputs.digest }}
          SIGNER: ${{ steps.push-signer.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          for t in ingress settle ops signer; do
            var="${t^^}"
            digest="${!var}"
            repo="ghcr.io/bloque-app/aledgent-$t"
            test -n "$digest"
            # The registry answers with the digest that was pushed (whole: a `head` would end it in SIGPIPE).
            docker buildx imagetools inspect "$repo@$digest" > /dev/null
            echo "- \`$repo:sha-$COMMIT$ROOTS_TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$t=$repo@$digest" >> "$GITHUB_OUTPUT"
          done

  core:
    name: core (VOS Agent)
    if: (inputs.version != '' || github.event_name != 'push') && inputs.genesis_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      core: ${{ steps.pushed.outputs.core }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      # VOS's host crates and three Rust builds: the runner's preinstalled toolchains make room.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # core.Dockerfile builds core.vos; the labels here are the final image's metadata only, and
      # reach no build stage. The core carries no auto-update label: it is never replaced unattended.
      - name: Build core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/core.Dockerfile
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=core${{ env.ROOTS_TAG }}
          cache-to: type=gha,scope=core${{ env.ROOTS_TAG }},mode=max
          load: true
          tags: aledgent-core:ci

      - name: Run the binary in its image, and the programs it serves
        run: |
          set -euo pipefail
          out=$(docker run --rm aledgent-core:ci no-such-command 2>&1 || true)
          echo "$out"
          grep -q 'aledgent-core-host serve' <<<"$out"
          # opsctl beside it, for a restore from this one image (core.Dockerfile's header).
          out=$(docker run --rm --entrypoint /usr/local/bin/opsctl aledgent-core:ci no-such-command 2>&1 || true)
          echo "$out"
          grep -q 'usage: opsctl' <<<"$out"
          test "$(docker image inspect -f '{{.Config.User}}' aledgent-core:ci)" = "65532:65532"
          test "$(docker image inspect -f '{{index .Config.Labels "app.aledgent.roots"}}' aledgent-core:ci)" = "$ROOTS"
          id=$(docker create aledgent-core:ci)
          docker cp "$id:/usr/share/aledgent" "$RUNNER_TEMP/core"
          docker rm "$id" > /dev/null
          ls -l "$RUNNER_TEMP/core"
          test -s "$RUNNER_TEMP/core/agent_runtime.pvm"
          test -s "$RUNNER_TEMP/core/core.vos"

      - name: Size
        run: |
          size=$(docker image inspect -f '{{.Size}}' aledgent-core:ci)
          {
            echo "### Image (linux/amd64)"
            echo
            echo "| Image | Size |"
            echo "|---|---:|"
            echo "| \`aledgent-core\` | $((size / 1024 / 1024)) MiB ($size B) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # What to push: `sha-<commit>` (with the roots' suffix on a dispatch), and a release's
      # `v<version>`, `+` made `_`.
      - name: Tags
        id: meta
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        run: |
          set -euo pipefail
          for t in core; do
            repo="ghcr.io/bloque-app/aledgent-$t"
            case "$MODE" in
              release) echo "$t=$repo:sha-$COMMIT,$repo:v${VERSION//+/_}" ;;
              dispatch) echo "$t=$repo:sha-$COMMIT$ROOTS_TAG" ;;
              edge) echo "$t=$repo:sha-$COMMIT,$repo:edge" ;;
            esac
          done >> "$GITHUB_OUTPUT"
      - name: Push core
        id: push-core
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/core.Dockerfile
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: ROOTS=${{ env.ROOTS }}
          cache-from: type=gha,scope=core${{ env.ROOTS_TAG }}
          push: true
          tags: ${{ steps.meta.outputs.core }}
      # Each image's digest, read back from the registry, and its reference with that digest: the
      # workflow's outputs.
      - name: Pushed
        id: pushed
        if: env.MODE == 'release' || env.MODE == 'dispatch'
        env:
          CORE: ${{ steps.push-core.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          for t in core; do
            var="${t^^}"
            digest="${!var}"
            repo="ghcr.io/bloque-app/aledgent-$t"
            test -n "$digest"
            # The registry answers with the digest that was pushed (whole: a `head` would end it in SIGPIPE).
            docker buildx imagetools inspect "$repo@$digest" > /dev/null
            echo "- \`$repo:sha-$COMMIT$ROOTS_TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$t=$repo@$digest" >> "$GITHUB_OUTPUT"
          done

  # F-038 §12 step 0, DEC-27 (i): the current host on a deployment's genesis package and runtime
  # (this file's header). Published on a dispatch with `genesis_image`; tested on every pull request.
  core-on-genesis:
    name: core on genesis
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'workflow_dispatch' && inputs.genesis_image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    # The pull request's test pushes its tampered genesis here, and the build pulls it by digest.
    services:
      registry:
        image: docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000
    env:
      GENESIS_IMAGE: ${{ inputs.genesis_image }}
      GENESIS_MANIFEST: ${{ inputs.genesis_manifest }}
      GENESIS_CODE: ${{ inputs.genesis_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af > /dev/null
          df -h /

      # The genesis: a dispatch's `genesis_image` and `genesis_manifest`; on a pull request, the
      # current release's core image, with a manifest its own host writes (`code-manifest`; the
      # build profiles in it are this test's, and the check reads only the digests and lengths).
      - name: The genesis
        id: genesis
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$RUNNER_TEMP/genesis-code"
          mkdir -p "$code"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
            gh release download "$tag" --repo "$REPO" -p images.json -O "$RUNNER_TEMP/images.json"
            GENESIS_IMAGE=$(jq -er .images.core "$RUNNER_TEMP/images.json")
            echo "The genesis: release $tag's core, $GENESIS_IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if ! [[ "$GENESIS_IMAGE" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::genesis_image must name the deployment's core image by digest (<image>@sha256:<64 hex>), not '$GENESIS_IMAGE'"
            exit 1
          fi
          docker pull --platform linux/amd64 "$GENESIS_IMAGE"
          id=$(docker create --platform linux/amd64 "$GENESIS_IMAGE")
          docker cp "$id:/usr/share/aledgent" "$RUNNER_TEMP/genesis-share"
          docker rm "$id" > /dev/null
          ls -l "$RUNNER_TEMP/genesis-share"
          # The host is built with the genesis's roots (cs-q04): its label, or `roots` without one.
          roots=$(docker image inspect -f '{{index .Config.Labels "app.aledgent.roots"}}' "$GENESIS_IMAGE")
          case "$roots" in
            v1|v2) ;;
            ''|'<no value>') roots="$ROOTS"; echo "::notice::the genesis image has no app.aledgent.roots label: the host is built with roots $roots" ;;
            *) echo "::error::the genesis image's roots are '$roots'"; exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            chmod 0777 "$code"
            cp agents/Cargo.lock "$code/Cargo.lock"
            rev=$(jq -er .commit "$RUNNER_TEMP/images.json")
            jq -n --arg rev "$rev" '
              def p(target; toolchain; opt): {target: target, toolchain: toolchain, opt_level: opt,
                features: [], source_revision: $rev, cargo_lock: "Cargo.lock"};
              {kernel: {revision: "e9a7b08"},
               package: p("riscv64em-vos"; "nightly-2026-03-20"; "s"),
               runtime: p("riscv64em-vos"; "nightly-2026-03-20"; "3"),
               native_decide: p("x86_64-unknown-linux-gnu"; "nightly-2026-03-20"; "3")}' \
              > "$code/profile.json"
            docker run --rm --platform linux/amd64 -v "$code:/w" "$GENESIS_IMAGE" code-manifest \
              --actor /usr/share/aledgent/core.vos --runtime /usr/share/aledgent/agent_runtime.pvm \
              --profile /w/profile.json --out /w/code.bin | tee "$RUNNER_TEMP/manifest.json"
            GENESIS_CODE=$(jq -er .version "$RUNNER_TEMP/manifest.json")
            rm "$code/profile.json" "$code/Cargo.lock"
          else
            if ! [[ "$GENESIS_MANIFEST" =~ ^([0-9a-fA-F]{2})+$ ]]; then
              echo "::error::genesis_manifest: the deployment's genesis code manifest (aledgent/code/v1), in hex, is required"
              exit 1
            fi
            python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.argv[1]))' \
              "$GENESIS_MANIFEST" > "$code/code.bin"
            # Required on a dispatch: without H0 the check proves only that the bytes are the supplied
            # manifest's, not the deployment's genesis code (review of #28). Either case is accepted
            # and lowercased here, once, so that the check, the build argument and the output all
            # carry the same lowercase value.
            GENESIS_CODE="${GENESIS_CODE,,}"
            if ! [[ "$GENESIS_CODE" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::genesis_code: the deployment's genesis code version H0 (64 hex) is required with genesis_image, not '$GENESIS_CODE'"
              exit 1
            fi
          fi
          ls -l "$code"
          short="${GENESIS_IMAGE##*@sha256:}"
          short="${short:0:12}"
          {
            echo "image=$GENESIS_IMAGE"
            echo "short=$short"
            echo "roots=$roots"
            echo "code=$GENESIS_CODE"
            echo "context=$code"
          } >> "$GITHUB_OUTPUT"

      # The pull request's tampered genesis: the release's image with one byte of core.vos changed,
      # in the registry on the runner, so that the build pulls it by digest as it would a real one.
      - name: A tampered copy of the genesis
        id: tampered
        if: github.event_name == 'pull_request'
        env:
          GENESIS: ${{ steps.genesis.outputs.image }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/tampered"
          mkdir -p "$dir"
          cp "$RUNNER_TEMP/genesis-share/core.vos" "$dir/core.vos"
          python3 - "$dir/core.vos" <<'EOF'
          import sys
          p = sys.argv[1]
          b = bytearray(open(p, "rb").read())
          b[len(b) // 2] ^= 0x01
          open(p, "wb").write(bytes(b))
          EOF
          if cmp -s "$dir/core.vos" "$RUNNER_TEMP/genesis-share/core.vos"; then
            echo "::error::the tampered core.vos is the genesis's"; exit 1
          fi
          printf 'FROM %s\nCOPY core.vos /usr/share/aledgent/core.vos\n' "$GENESIS" > "$dir/Dockerfile"
          DOCKER_BUILDKIT=1 docker build --platform linux/amd64 -t localhost:5000/aledgent-core-tampered:ci "$dir"
          docker push localhost:5000/aledgent-core-tampered:ci | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | cut -d' ' -f2)
          test -n "$digest"
          echo "image=localhost:5000/aledgent-core-tampered@$digest" >> "$GITHUB_OUTPUT"

      # network=host: the builder reaches the registry on the runner.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: network=host
      - name: Log in to GHCR
        if: env.MODE == 'dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Steps 1 to 3 of core.Dockerfile (the host), then the genesis bytes, checked. The host's
      # layers are the core job's (scope `core`) where nothing before them changed.
      - name: Build core on genesis
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/core.Dockerfile
          target: core-on-genesis
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: |
            ROOTS=${{ steps.genesis.outputs.roots }}
            GENESIS_IMAGE=${{ steps.genesis.outputs.image }}
            GENESIS_CODE=${{ steps.genesis.outputs.code }}
          build-contexts: genesis-code=${{ steps.genesis.outputs.context }}
          cache-from: |
            type=gha,scope=core-on-genesis-${{ steps.genesis.outputs.roots }}
            type=gha,scope=core${{ steps.genesis.outputs.roots == 'v1' && '-roots-v1' || '' }}
          cache-to: type=gha,scope=core-on-genesis-${{ steps.genesis.outputs.roots }},mode=max
          load: true
          tags: aledgent-core-on-genesis:ci

      - name: The image carries the genesis bytes and the current host
        env:
          GENESIS: ${{ steps.genesis.outputs.image }}
          ROOTS_GENESIS: ${{ steps.genesis.outputs.roots }}
        run: |
          set -euo pipefail
          img=aledgent-core-on-genesis:ci
          out=$(docker run --rm "$img" no-such-command 2>&1 || true)
          grep -q 'aledgent-core-host serve' <<<"$out"
          grep -q 'aledgent-core-host check-code' <<<"$out"
          out=$(docker run --rm --entrypoint /usr/local/bin/opsctl "$img" no-such-command 2>&1 || true)
          grep -q 'usage: opsctl' <<<"$out"
          test "$(docker image inspect -f '{{.Config.User}}' "$img")" = "65532:65532"
          test "$(docker image inspect -f '{{index .Config.Labels "app.aledgent.roots"}}' "$img")" = "$ROOTS_GENESIS"
          test "$(docker image inspect -f '{{index .Config.Labels "app.aledgent.genesis.image"}}' "$img")" = "$GENESIS"
          id=$(docker create "$img")
          docker cp "$id:/usr/share/aledgent" "$RUNNER_TEMP/built-share"
          docker cp "$id:/usr/local/bin/aledgent-core-host" "$RUNNER_TEMP/built-host"
          docker rm "$id" > /dev/null
          ls -l "$RUNNER_TEMP/built-share"
          # Byte for byte the genesis image's.
          cmp "$RUNNER_TEMP/built-share/core.vos" "$RUNNER_TEMP/genesis-share/core.vos"
          cmp "$RUNNER_TEMP/built-share/agent_runtime.pvm" "$RUNNER_TEMP/genesis-share/agent_runtime.pvm"
          jq . "$RUNNER_TEMP/built-share/genesis-code.json"
          code=$(jq -er .code "$RUNNER_TEMP/built-share/genesis-code.json")
          {
            echo "### Core on genesis (linux/amd64)"
            echo
            echo "- genesis image: \`$GENESIS\` (roots $ROOTS_GENESIS)"
            echo "- genesis code H0: \`$code\` (package and runtime checked by \`check-code\`)"
            echo "- core.vos: \`$(sha256sum < "$RUNNER_TEMP/built-share/core.vos" | cut -d' ' -f1)\` (sha-256)"
            echo "- agent_runtime.pvm: \`$(sha256sum < "$RUNNER_TEMP/built-share/agent_runtime.pvm" | cut -d' ' -f1)\` (sha-256)"
            echo "- aledgent-core-host: \`$(sha256sum < "$RUNNER_TEMP/built-host" | cut -d' ' -f1)\` (sha-256), built at \`$COMMIT\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The pull request's refusals, from the builder's cache (the host is built): the tampered
      # copy fails the manifest check, and a genesis named by tag fails before it.
      - name: A tampered genesis, and one named by tag, fail the build
        if: github.event_name == 'pull_request'
        env:
          TAMPERED: ${{ steps.tampered.outputs.image }}
          ROOTS_GENESIS: ${{ steps.genesis.outputs.roots }}
          CONTEXT: ${{ steps.genesis.outputs.context }}
        run: |
          set -euo pipefail
          build() {
            docker buildx build -f deploy/docker/core.Dockerfile --target core-on-genesis \
              --platform linux/amd64 --progress plain \
              --build-arg ROOTS="$ROOTS_GENESIS" --build-arg GENESIS_IMAGE="$1" \
              --build-context genesis-code="$CONTEXT" .
          }
          if build "$TAMPERED" > "$RUNNER_TEMP/tampered.log" 2>&1; then
            cat "$RUNNER_TEMP/tampered.log"
            echo "::error::a tampered genesis built"; exit 1
          fi
          grep -E 'check-code: the package and runtime are not the genesis code [0-9a-f]{64} \(Digest\(Package\)\)' \
            "$RUNNER_TEMP/tampered.log" || { tail -100 "$RUNNER_TEMP/tampered.log"; exit 1; }
          by_tag="${TAMPERED%@*}:ci"
          if build "$by_tag" > "$RUNNER_TEMP/by-tag.log" 2>&1; then
            cat "$RUNNER_TEMP/by-tag.log"
            echo "::error::a genesis named by tag built"; exit 1
          fi
          # The refusal's own line, with the name expanded (the Dockerfile's text has it unexpanded).
          grep -F "by digest (<image>@sha256:<64 hex>), not '$by_tag'" "$RUNNER_TEMP/by-tag.log" \
            || { tail -100 "$RUNNER_TEMP/by-tag.log"; exit 1; }
          echo "- refused: a tampered genesis (\`$TAMPERED\`) and a genesis named by tag" >> "$GITHUB_STEP_SUMMARY"

      # A dispatch from main or develop: pushed as `host-<commit>-on-genesis-<short>` only.
      - name: Push core on genesis
        id: push
        if: env.MODE == 'dispatch'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/core.Dockerfile
          target: core-on-genesis
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          build-args: |
            ROOTS=${{ steps.genesis.outputs.roots }}
            GENESIS_IMAGE=${{ steps.genesis.outputs.image }}
            GENESIS_CODE=${{ steps.genesis.outputs.code }}
          build-contexts: genesis-code=${{ steps.genesis.outputs.context }}
          cache-from: type=gha,scope=core-on-genesis-${{ steps.genesis.outputs.roots }}
          push: true
          tags: ghcr.io/bloque-app/aledgent-core:host-${{ env.COMMIT }}-on-genesis-${{ steps.genesis.outputs.short }}
      - name: Pushed
        if: env.MODE == 'dispatch'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: host-${{ env.COMMIT }}-on-genesis-${{ steps.genesis.outputs.short }}
        run: |
          set -euo pipefail
          repo=ghcr.io/bloque-app/aledgent-core
          test -n "$DIGEST"
          docker buildx imagetools inspect "$repo@$DIGEST" > /dev/null
          echo "Pushed: \`$repo:$TAG@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  sidecar:
    name: sidecar (GHCR)
    if: inputs.genesis_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      sidecar: ${{ steps.pushed.outputs.sidecar }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: env.MODE != 'check'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build sidecar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: sidecar
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          cache-from: |
            type=gha,scope=sidecar
            type=gha,scope=services
          cache-to: type=gha,scope=sidecar,mode=max
          load: true
          tags: aledgent-sidecar:ci

      # As a CI job runs it (deploy/docker/SIDECAR.md): healthy through the image's own health
      # check, and through a `--health-cmd` (shell form); then a party, its account, an issuance in
      # each seeded asset, and its balance, over HTTP.
      - name: The sidecar as a service container
        run: |
          set -euo pipefail
          test "$(docker image inspect -f '{{.Config.User}}' aledgent-sidecar:ci)" = "65532:65532"
          docker run -d --name sidecar-image -p 18080:8080 aledgent-sidecar:ci
          docker run -d --name sidecar-cmd -p 18081:8080 \
            --health-cmd "aledgent-sidecar health" --health-interval 1s --health-retries 30 \
            aledgent-sidecar:ci
          for c in sidecar-image sidecar-cmd; do
            for i in $(seq 1 60); do
              h=$(docker inspect -f '{{.State.Health.Status}}' "$c")
              [ "$h" = healthy ] && break
              [ "$i" = 60 ] && { docker logs "$c"; docker inspect -f '{{json .State.Health}}' "$c"; exit 1; }
              sleep 1
            done
            echo "$c: $h"
          done
          docker logs sidecar-image
          B=http://127.0.0.1:18080
          T="Authorization: Bearer aledgent-sidecar-test-operator-token"
          J="Content-Type: application/json"
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/metrics)" = 401
          curl -sf $B/sidecar | jq -e '.assets == ["COPM/2","TSTA/2","TSTB/2","TSTC/6"]'
          # The sample configuration's service principals, each under its public test token, each
          # its own principal and never the operator.
          op=$(curl -sf $B/sidecar | jq -er .operator)
          curl -sf $B/sidecar | jq -e '.service_principals | keys == ["custodian","issuer","onboarding"]'
          for n in issuer custodian onboarding; do
            me=$(curl -sf -H "Authorization: Bearer aledgent-sidecar-test-$n-token" \
                   $B/v1/principals/self/answering | jq -er .principal)
            test "$me" = "$(curl -sf $B/sidecar | jq -er --arg n "$n" '.service_principals[$n].principal')"
            test "$me" != "$op"
          done
          # A configuration of the job's own, as an integrating party passes it: inline JSON, each
          # token from a variable of the container. A blank one, or the retired spelling, fails the
          # start (the container exits).
          docker run -d --name sidecar-config -p 18082:8080 \
            -e DESK_TOKEN=ci-desk-token -e KYC_TOKEN=ci-kyc-token \
            -e ALEDGENT_SIDECAR_SERVICE_PRINCIPALS='{"principals": [
              {"name": "desk", "role": "issuance_authority", "token_env": "DESK_TOKEN", "assets": ["TSTC"]},
              {"name": "kyc", "role": "identities_principal", "token_env": "KYC_TOKEN"}]}' \
            -e ALEDGENT_SIDECAR_SYSTEM_ACCOUNTS=desk/fee=desk \
            aledgent-sidecar:ci
          C=http://127.0.0.1:18082
          for i in $(seq 1 30); do curl -sf $C/sidecar > /dev/null && break; sleep 1; done
          docker logs sidecar-config
          S=$(curl -sf $C/sidecar)
          jq -e '.service_principals | keys == ["desk","kyc"]' <<<"$S"
          jq -e '[.service_principals.desk.grants[] | select(.kind=="issuance") | .subject.asset] == ["TSTC"]' <<<"$S"
          jq -e '.system_accounts[0].service == "desk"' <<<"$S"
          for p in desk:ci-desk-token kyc:ci-kyc-token; do
            me=$(curl -sf -H "Authorization: Bearer ${p#*:}" $C/v1/principals/self/answering | jq -er .principal)
            test "$me" = "$(jq -er --arg n "${p%%:*}" '.service_principals[$n].principal' <<<"$S")"
            test "$me" != "$(jq -er .operator <<<"$S")"
          done
          for bad in "" "issuer=ISSUER_TOKEN"; do
            if docker run --rm -e ALEDGENT_SIDECAR_SERVICE_PRINCIPALS="$bad" aledgent-sidecar:ci describe; then
              echo "started with ALEDGENT_SIDECAR_SERVICE_PRINCIPALS='$bad'" >&2; exit 1
            fi
          done
          id=$(curl -sf -H "$T" -H "$J" -H 'client-key: ci-identity' $B/v1/identities \
                 -d '{"kind":"person","verifier":"0a"}' | jq -r .result.identity)
          acct=$(curl -sf -H "$T" -H "$J" -H 'client-key: ci-account' $B/v1/accounts \
                 -d "{\"owner\":\"$id\",\"kind\":\"customer\",\"custody\":\"delegated\"}" | jq -r .result.account)
          for a in COPM:12345 TSTA:100 TSTB:7 TSTC:1000000; do
            curl -sf -H "$T" -H "$J" -H "client-key: ci-issue-${a%%:*}" $B/v1/issuances \
              -d "{\"asset\":\"${a%%:*}\",\"destination\":\"$acct\",\"amount\":\"${a##*:}\"}" > /dev/null
            got=$(curl -sf -H "$T" "$B/v1/balances?account=$acct&asset=${a%%:*}" | jq -r '.rows[0].available')
            echo "${a%%:*}: $got"
            test "$got" = "${a##*:}"
          done
          docker rm -f sidecar-image sidecar-cmd sidecar-config > /dev/null
          size=$(docker image inspect -f '{{.Size}}' aledgent-sidecar:ci)
          echo "aledgent-sidecar (linux/amd64): $((size / 1024 / 1024)) MiB ($size B)" >> "$GITHUB_STEP_SUMMARY"

      # What to push: `sha-<commit>` (always v2 roots), and a release's `v<version>` (`+` made `_`)
      # or, on a push to main, `edge`.
      - name: Tags
        id: meta
        if: env.MODE != 'check'
        run: |
          set -euo pipefail
          for t in sidecar; do
            repo="ghcr.io/bloque-app/aledgent-$t"
            case "$MODE" in
              release) echo "$t=$repo:sha-$COMMIT,$repo:v${VERSION//+/_}" ;;
              dispatch) echo "$t=$repo:sha-$COMMIT" ;;
              edge) echo "$t=$repo:sha-$COMMIT,$repo:edge" ;;
            esac
          done >> "$GITHUB_OUTPUT"
      - name: Push sidecar
        id: push-sidecar
        if: env.MODE != 'check'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/services.Dockerfile
          target: sidecar
          platforms: linux/amd64
          labels: ${{ env.LABELS }}
          cache-from: type=gha,scope=sidecar
          push: true
          tags: ${{ steps.meta.outputs.sidecar }}
      # Each image's digest, read back from the registry, and its reference with that digest: the
      # workflow's outputs.
      - name: Pushed
        id: pushed
        if: env.MODE != 'check'
        env:
          SIDECAR: ${{ steps.push-sidecar.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Pushed:" >> "$GITHUB_STEP_SUMMARY"
          for t in sidecar; do
            var="${t^^}"
            digest="${!var}"
            repo="ghcr.io/bloque-app/aledgent-$t"
            test -n "$digest"
            # The registry answers with the digest that was pushed (whole: a `head` would end it in SIGPIPE).
            docker buildx imagetools inspect "$repo@$digest" > /dev/null
            echo "- \`$repo:sha-$COMMIT@$digest\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$t=$repo@$digest" >> "$GITHUB_OUTPUT"
          done
