[[acceptance]]
id = "AC-A1.1"
story = "US-A1"
epic = "A"
text = "Given a valid identity, When I open an account, Then by the time the response returns it exists, is addressable and can be credited (`REQ-LA-1`, `INV-9`)."

[[acceptance]]
id = "AC-A1.2"
story = "US-A1"
epic = "A"
text = "Given I hold no balance on the settlement layer, Then no cost is shown to me at any point (`REQ-SN-1`)."

[[acceptance]]
id = "AC-A1.3"
story = "US-A1"
epic = "A"
text = "Given I repeat with the same client key, Then I get the same account, not a second one (`REQ-OP-11`, `ERR-ClientKeyReused`)."

[[acceptance]]
id = "AC-A1.4"
story = "US-A1"
epic = "A"
text = "Given an account exists, When value arrives for it, Then it is credited. There is no state in which an account exists but cannot be credited (`INV-9`)."

[[acceptance]]
id = "AC-A2.1"
story = "US-A2"
epic = "A"
text = "Given one identity, When I open a second account under my own authority, Then both are distinct and separately addressable (`REQ-LA-1`, `REQ-ID-6`)."

[[acceptance]]
id = "AC-A2.2"
story = "US-A2"
epic = "A"
text = "Given two of my accounts, When I transfer between them, Then it is one posting and is final when accepted (`INV-1`, `REQ-OP-1`)."

[[acceptance]]
id = "AC-A4.1"
story = "US-A4"
epic = "A"
text = "Given a pooled arrangement, Then each drawing identity holds an explicit, bounded authority over the account (`REQ-LA-6`, `REQ-AU-2`)."

[[acceptance]]
id = "AC-A4.2"
story = "US-A4"
epic = "A"
text = "Given no such authority, When a drawing is attempted, Then it is refused with `ERR-NotAuthorised`. It is never allowed through with only a log entry."

[[acceptance]]
id = "AC-A5.1"
story = "US-A5"
epic = "A"
text = "Given owned custody, Then no operator authority exists over the account, and aledgent cannot move its value (`REQ-AU-6`, `INV-20`)."

[[acceptance]]
id = "AC-A5.2"
story = "US-A5"
epic = "A"
text = "Given delegated custody, Then every operator action on my account is recorded as an operator action and is visible to me (`REQ-AU-7`)."

[[acceptance]]
id = "AC-A5.3"
story = "US-A5"
epic = "A"
text = "Given I choose owned custody, Then I am shown which recovery mechanisms apply to the account before the choice takes effect (`REQ-AU-9`)."

[[acceptance]]
id = "AC-A5.4"
story = "US-A5"
epic = "A"
text = "Given several credentials of mine, When any one of them acts on an owned account it is not scoped away from, Then my owner authority is what acts. And When I add or remove a credential without an existing credential or a completed recovery, Then it is refused with `ERR-NotAuthorised` (`REQ-AU-20`)."

[[acceptance]]
id = "AC-A6.1"
story = "US-A6"
epic = "A"
text = "Given a non-zero balance, When closure is attempted, Then it fails with `ERR-AccountNotEmpty` (`REQ-LA-4`)."

[[acceptance]]
id = "AC-A6.2"
story = "US-A6"
epic = "A"
text = "Given a balance is moved out, Then it moves by posting to a named destination (`INV-2`)."

[[acceptance]]
id = "AC-A7.1"
story = "US-A7"
epic = "A"
text = "Given an owned account, When I delegate custody with my own credential, Then operator authority exists after that, and the change is recorded as mine (`REQ-AU-11`, `REQ-AU-12`)."

[[acceptance]]
id = "AC-A7.2"
story = "US-A7"
epic = "A"
text = "Given an owned account, When the operator tries to delegate its custody, Then it is refused with `ERR-NotAuthorised` (`REQ-AU-12`)."

[[acceptance]]
id = "AC-A7.3"
story = "US-A7"
epic = "A"
text = "Given a delegated account and a proven holder credential, When I reclaim custody, Then no operator authority remains. In-flight operations finish under the authority that started them. Any encumbrance the operator placed was lifted, or carried over with my consent (`REQ-AU-13`)."

[[acceptance]]
id = "AC-A7.4"
story = "US-A7"
epic = "A"
text = "Given a delegated account and no working holder credential, When I reclaim custody, Then it is refused with `ERR-CredentialInvalid` (`REQ-AU-13`)."

[[acceptance]]
id = "AC-A7.5"
story = "US-A7"
epic = "A"
text = "Given agents I have granted authority to, When custody changes, Then their grants do not change (`REQ-AU-14`)."

[[acceptance]]
id = "AC-A8.1"
story = "US-A8"
epic = "A"
text = "Given a recovery started for my account, Then it cannot complete without the recovery authority's approval. The operator alone cannot complete it (`REQ-AU-15`)."

[[acceptance]]
id = "AC-A8.2"
story = "US-A8"
epic = "A"
text = "Given a pending recovery, Then it is visible on my account. Presenting my existing credential to `cancel_recovery` before the delay ends cancels it. Using my credential for anything else does not (`REQ-AU-16`, `INV-20`)."

[[acceptance]]
id = "AC-A8.3"
story = "US-A8"
epic = "A"
text = "Given the delay has ended and the recovery authority has approved, Then a new credential is issued to me and the previous one stops working. The audit trail names every approving principal (`REQ-AU-16`, `REQ-AT-1`)."

[[acceptance]]
id = "AC-A8.4"
story = "US-A8"
epic = "A"
text = "Given a recovery attempted before the delay has ended, Then completion is refused with `ERR-RecoveryNotElapsed` (`REQ-AU-16`)."

[[acceptance]]
id = "AC-A8.5"
story = "US-A8"
epic = "A"
text = "Given I named a successor, When the successor claims after the delay and I did not cancel, Then the successor holds owner authority and I no longer do (`REQ-AU-17`)."

[[acceptance]]
id = "AC-A8.6"
story = "US-A8"
epic = "A"
text = "Given I registered a holder-held recovery credential, When I present it, Then it acts as my owner authority at once, with no delay (`REQ-AU-18`)."

[[acceptance]]
id = "AC-A9.1"
story = "US-A9"
epic = "A"
text = "Given a principal with the operator's authority to open identities, When it opens an identity with no credential, Then the identity exists with an empty set. Given any other principal, Then the opening without a credential is refused with `ERR-NotAuthorised` (`REQ-ID-8`)."

[[acceptance]]
id = "AC-A9.2"
story = "US-A9"
epic = "A"
text = "Given an identity with an empty set, When an owned-custody account is opened for it, or one of its accounts is changed to owned custody, Then it is refused with `ERR-NotAuthorised` (`REQ-ID-8`)."

[[acceptance]]
id = "AC-A9.3"
story = "US-A9"
epic = "A"
text = "Given an open enrolment, When I present its secret and a valid proof of possession over its challenge, Then my credential is a member of the set, marked enrolled, with the stated scope. The enrolment is closed, and the completion is attributed, audited, notified to the opener and shown to every authority holder (`REQ-AU-22`, `REQ-AT-1`, `INV-20`)."

[[acceptance]]
id = "AC-A9.4"
story = "US-A9"
epic = "A"
text = "Given an enrolment that is expired, used or cancelled, or a wrong secret or proof, When I complete it, Then it is refused with `ERR-CredentialInvalid` and the set is unchanged. Given failed completions past the deployment's limit, Then the enrolment is cancelled (`REQ-AU-22`)."

[[acceptance]]
id = "AC-A9.5"
story = "US-A9"
epic = "A"
text = "Given an identity whose set holds a credential, When an enrolment is opened or completed for it, Then it is refused with `ERR-NotAuthorised` (`REQ-AU-22`, `REQ-AU-20`)."

[[acceptance]]
id = "AC-A9.6"
story = "US-A9"
epic = "A"
text = "Given an enrolled credential, When it reclaims custody, Then the reclaim needs its proof that it works, as for any other credential (`REQ-AU-13`, `REQ-AU-22`)."

[[acceptance]]
id = "AC-B1.1"
story = "US-B1"
epic = "B"
text = "Given enough available balance, When I transfer, Then my account is debited and the payee's credited by postings that each balance: one posting when both accounts are in one partition, otherwise the debit, final when accepted, and the credit, applied within `NFR-19`'s bound (`REQ-RT-11`, `REQ-OP-1`, `INV-1`)."

[[acceptance]]
id = "AC-B1.2"
story = "US-B1"
epic = "B"
text = "Given not enough available balance, Then it fails with `ERR-InsufficientAvailable` and nothing changes (`REQ-LA-2`, `INV-3`)."

[[acceptance]]
id = "AC-B1.3"
story = "US-B1"
epic = "B"
text = "Given the transfer happens, Then the settlement layer is not touched and no cost is incurred (`REQ-SL-5`)."

[[acceptance]]
id = "AC-B1.4"
story = "US-B1"
epic = "B"
text = "Given a zero amount, Then it fails with `ERR-ZeroAmount`. It does not silently succeed or silently fail."

[[acceptance]]
id = "AC-B2.1"
story = "US-B2"
epic = "B"
text = "Given many concurrent spends that total more than the balance, Then exactly as many succeed as the balance covers. The final balance is not negative (`INV-3`, `REQ-KER-4`)."

[[acceptance]]
id = "AC-B2.2"
story = "US-B2"
epic = "B"
text = "Given the check succeeds, Then the reduction of available is atomic with the check (`REQ-BA-4`)."

[[acceptance]]
id = "AC-B3.1"
story = "US-B3"
epic = "B"
text = "Given a multi-leg submission, Then either every leg applies or none does (`REQ-KER-10`)."

[[acceptance]]
id = "AC-B3.2"
story = "US-B3"
epic = "B"
text = "Given legs that debit the same account and asset, Then their amounts are added together for the availability check (`REQ-BA-4`)."

[[acceptance]]
id = "AC-B3.3"
story = "US-B3"
epic = "B"
text = "Given the submission exceeds the published maximum, Then it is refused at submission with `ERR-BatchTooLarge`, and nothing is taken in (`REQ-CS-10`)."

[[acceptance]]
id = "AC-B3.4"
story = "US-B3"
epic = "B"
text = "Given I read `limits()`, Then it states the most legs one submission may carry. Given a submission of exactly that many legs, Then it is taken in (`REQ-CS-10`)."

[[acceptance]]
id = "AC-C1.1"
story = "US-C1"
epic = "C"
text = "Given an authorisation from a principal acknowledged at `Received` (the default, `REQ-CS-9`), When I reserve, Then the reply acknowledges the request at `Received` with its operation reference, as for every command that moves value (`REQ-CS-8`, `NFR-1`). The decision, `Reserved` or `Rejected` with the refusal named, follows by query and by notification, not after any external event. Once `Reserved`, available has fallen by the amount, in the same step that decided it (`REQ-BA-4`, `REQ-CS-3`, `NFR-15`)."

[[acceptance]]
id = "AC-C1.2"
story = "US-C1"
epic = "C"
text = "Given the reservation succeeds, Then no later read shows that value as spendable (`REQ-BA-3`)."

[[acceptance]]
id = "AC-C1.3"
story = "US-C1"
epic = "C"
text = "Given not enough available balance, Then the decision is a refusal. Refusal is also the default when the decision cannot be made (`REQ-AU-1`)."

[[acceptance]]
id = "AC-C2.1"
story = "US-C2"
epic = "C"
text = "Given a capture at or below the reserved amount, Then the difference returns to available in the same posting. A repeat is a no-op that returns the original outcome (`REQ-OP-2`, `REQ-OP-3`)."

[[acceptance]]
id = "AC-C2.2"
story = "US-C2"
epic = "C"
text = "Given a capture above the reserved amount, Then it fails with `ERR-AmountMismatch` and nothing changes (`REQ-OP-2`)."

[[acceptance]]
id = "AC-C3.1"
story = "US-C3"
epic = "C"
text = "Given a release, Then value returns to available in one posting (`REQ-OP-1`)."

[[acceptance]]
id = "AC-C3.2"
story = "US-C3"
epic = "C"
text = "Given the underlying external leg may still execute, Then release is refused and the operation moves to `Needs-Review` (`REQ-OP-9`)."

[[acceptance]]
id = "AC-C4.1"
story = "US-C4"
epic = "C"
text = "Given a reservation past its deadline, Then it appears in a queue with an owner and a service level (`REQ-OP-5`, `REQ-OP-6`)."

[[acceptance]]
id = "AC-C4.2"
story = "US-C4"
epic = "C"
text = "Given any point in time, Then the age of the oldest non-terminal operation can be observed (`REQ-OP-8`)."

[[acceptance]]
id = "AC-C6.1"
story = "US-C6"
epic = "C"
text = "Given open reservations I made on several accounts and assets, When I read my open reservations, Then I get, per (account, asset), their count, their sum and their earliest and latest deadline, and each one itemised with its reference, amount and deadline, all from one view that names its position (`REQ-QR-7`, `REQ-QR-2`)."

[[acceptance]]
id = "AC-C6.2"
story = "US-C6"
epic = "C"
text = "Given a reservation captured, released, or expired and released, Then it is not in the answer of any view that includes that closing (`REQ-QR-7`)."

[[acceptance]]
id = "AC-C6.3"
story = "US-C6"
epic = "C"
text = "Given reservations another principal made on an account I hold no authority over, Then they are not in my answer, and their amounts are not in my aggregate (`REQ-QR-7`, `REQ-QR-4`)."

[[acceptance]]
id = "AC-C6.4"
story = "US-C6"
epic = "C"
text = "Given I registered a report cadence, When a period closes, Then I receive one report for it, delivered at least once under one identity, carrying the same aggregate a query at its view would return, and the latest final anchor (`REQ-EV-8`, `REQ-EV-3`)."

[[acceptance]]
id = "AC-D1.1"
story = "US-D1"
epic = "D"
text = "Given an inbound arrival observed provisionally, Then nothing is credited (`REQ-OP-1`)."

[[acceptance]]
id = "AC-D1.2"
story = "US-D1"
epic = "D"
text = "Given the arrival reaches finality, and the settlement layer's record at that position still matches, Then it is credited in one posting (`REQ-IN-3`)."

[[acceptance]]
id = "AC-D1.3"
story = "US-D1"
epic = "D"
text = "Given the record no longer matches, Then the operation is `Orphaned` and no reversal is needed (`REQ-IN-4`)."

[[acceptance]]
id = "AC-D1.4"
story = "US-D1"
epic = "D"
text = "Given an arrival for an account aledgent tracks, Then it is credited whether or not aledgent started anything (`REQ-IN-1`)."

[[acceptance]]
id = "AC-D2.1"
story = "US-D2"
epic = "D"
text = "Given any window, Then a comparison of the settlement layer's records with ingested observations is available. Any difference is an incident (`REQ-IN-5`, `NFR-9`)."

[[acceptance]]
id = "AC-D2.2"
story = "US-D2"
epic = "D"
text = "Given a range that could not be read, Then it is recorded as an explicit gap, not silently skipped (`REQ-SA-7`)."

[[acceptance]]
id = "AC-D3.1"
story = "US-D3"
epic = "D"
text = "Given a submitted observation, Then aledgent works out the status itself and ignores any status the submitter claims (`REQ-IN-2`, `INV-11`)."

[[acceptance]]
id = "AC-D3.2"
story = "US-D3"
epic = "D"
text = "Given the same coordinate twice, Then it is applied once (`REQ-IN-1`, `INV-12`)."

[[acceptance]]
id = "AC-D3.3"
story = "US-D3"
epic = "D"
text = "Given two sources observe one event, Then exactly one of them writes (`REQ-IN-6`)."

[[acceptance]]
id = "AC-E1.1"
story = "US-E1"
epic = "E"
text = "Given a withdrawal, Then value is reserved before anything is submitted (`REQ-SO-1`, `INV-13`)."

[[acceptance]]
id = "AC-E1.2"
story = "US-E1"
epic = "E"
text = "Given execution succeeds, Then value leaves reserved only at finality (`REQ-OP-1`, `REQ-IN-3`)."

[[acceptance]]
id = "AC-E1.3"
story = "US-E1"
epic = "E"
text = "Given the executed amount differs from the reserved amount, Then it is `ERR-AmountMismatch`, and the difference is posted explicitly (`REQ-OP-2`)."

[[acceptance]]
id = "AC-E1.4"
story = "US-E1"
epic = "E"
text = "Given execution is refused before it could take effect, Then value returns to available (`REQ-SA-4`)."

[[acceptance]]
id = "AC-E1.5"
story = "US-E1"
epic = "E"
text = "Given the outcome is unknown, Then the operation is non-terminal and no release happens (`REQ-SO-4`, `REQ-OP-6`)."

[[acceptance]]
id = "AC-E3.1"
story = "US-E3"
epic = "E"
text = "Given an external leg cannot proceed because liquidity is lacking, Then the operation parks and no value is released. One alert is raised per affected position, not per operation (`REQ-SA-4`, `REQ-SN-2`)."

[[acceptance]]
id = "AC-E3.2"
story = "US-E3"
epic = "E"
text = "Given liquidity is restored, Then parked operations resume without an operator acting (`REQ-SN-2`)."

[[acceptance]]
id = "AC-E3.3"
story = "US-E3"
epic = "E"
text = "Given an operation partially executed, Then it MUST NOT park. It moves to `Needs-Review` (`REQ-OP-6`)."

[[acceptance]]
id = "AC-E4.1"
story = "US-E4"
epic = "E"
text = "Given an operation or asset the settlement adapter does not support, Then it is refused at submission with `ERR-UnsupportedLeg` (`REQ-SA-1`)."

[[acceptance]]
id = "AC-E4.2"
story = "US-E4"
epic = "E"
text = "Given an adapter whose connected network is not the declared settlement layer, Then the adapter refuses to serve (`REQ-SA-2`)."

[[acceptance]]
id = "AC-E4.3"
story = "US-E4"
epic = "E"
text = "Given a change to the settlement layer's rules that leaves what an instruction must carry unchanged, Then the adapter keeps serving, with no new release or configuration (`REQ-SA-9`)."

[[acceptance]]
id = "AC-E4.4"
story = "US-E4"
epic = "E"
text = "Given a change that alters what an instruction must carry, or an instruction the layer does not confirm as valid, Then the adapter refuses to serve until it has a format the layer confirms (`REQ-SA-9`)."

[[acceptance]]
id = "AC-F1.1"
story = "US-F1"
epic = "F"
text = "Given several assets, Then balances are kept separate per asset and never mixed (`INV-4`)."

[[acceptance]]
id = "AC-F1.2"
story = "US-F1"
epic = "F"
text = "Given an unregistered asset, Then any operation naming it fails with `ERR-UnknownAsset` (`REQ-AS-1`)."

[[acceptance]]
id = "AC-F3.1"
story = "US-F3"
epic = "F"
text = "Given an amount with more precision than the asset has, Then it is refused with `ERR-PrecisionExceeded`, not rounded. Every amount at every boundary is an exact integer count of minor units (`REQ-AS-4`, `INV-7`)."

[[acceptance]]
id = "AC-F4.1"
story = "US-F4"
epic = "F"
text = "Given issuance authority for an asset, When I issue, Then the destination is credited in one posting against the issuance counterparty. The trial balance still sums to zero (`REQ-AS-6`, `INV-5`)."

[[acceptance]]
id = "AC-F4.2"
story = "US-F4"
epic = "F"
text = "Given no issuance authority for the asset, Then issuance fails with `ERR-NotAuthorised` (`REQ-AU-10`)."

[[acceptance]]
id = "AC-F4.3"
story = "US-F4"
epic = "F"
text = "Given a redemption, Then value leaves available and is posted against the issuance counterparty (`REQ-AS-6`)."

[[acceptance]]
id = "AC-F5.1"
story = "US-F5"
epic = "F"
text = "Given a book-only asset, Then an external leg in it is refused at submission with `ERR-UnsupportedLeg`, and issuance in it works (`REQ-AS-7`)."

[[acceptance]]
id = "AC-F5.2"
story = "US-F5"
epic = "F"
text = "Given a binding whose settlement-layer asset is missing, not live, or has another symbol or precision in its own fields, Then it is refused with `ERR-UnsupportedLeg`. A name is never read (`REQ-AS-8`)."

[[acceptance]]
id = "AC-F5.3"
story = "US-F5"
epic = "F"
text = "Given a binding where the settlement layer's holding differs from the book's outstanding balance by one minor unit, Then it is refused, and the asset stays book-only with its issuance authority (`REQ-AS-8`)."

[[acceptance]]
id = "AC-F5.4"
story = "US-F5"
epic = "F"
text = "Given a binding at zero divergence, Then while it is pending the asset's issuance and redemption are refused with `ERR-NotAuthorised`; and When it is final, Then the asset is bound, its external legs are supported, and `NFR-9`'s third axis finds no difference (`REQ-AS-8`, `NFR-9`)."

[[acceptance]]
id = "AC-F5.5"
story = "US-F5"
epic = "F"
text = "Given a bound asset, When the settlement layer's description of it changes, Then nothing in the book changes, and nothing is held or refused (`REQ-AS-9`)."

[[acceptance]]
id = "AC-G1.1"
story = "US-G1"
epic = "G"
text = "Given a grant, Then it names the permitted operations and at least one bound. A grant with no bound cannot be expressed (`REQ-AU-2`, `REQ-AG-1`)."

[[acceptance]]
id = "AC-G1.2"
story = "US-G1"
epic = "G"
text = "Given the agent acts within its bounds, Then it succeeds. The audit trail records the action as the agent's, on my behalf, and separate from mine (`REQ-PN-1`, `REQ-AU-7`, `REQ-AT-1`)."

[[acceptance]]
id = "AC-G1.3"
story = "US-G1"
epic = "G"
text = "Given the agent exceeds a bound, Then it fails with `ERR-BoundExceeded` and nothing changes (`REQ-AG-2`)."

[[acceptance]]
id = "AC-G2.1"
story = "US-G2"
epic = "G"
text = "Given an agent, Then it has its own identity and its own credential (`REQ-AG-1`)."

[[acceptance]]
id = "AC-G2.2"
story = "US-G2"
epic = "G"
text = "Given an agent's credential, Then it cannot widen its own scope (`REQ-AU-4`)."

[[acceptance]]
id = "AC-G3.1"
story = "US-G3"
epic = "G"
text = "Given a revocation, Then every credential derived from the revoked authority stops working within the bound of `NFR-20` (`REQ-AU-3`)."

[[acceptance]]
id = "AC-G3.2"
story = "US-G3"
epic = "G"
text = "Given an operation already reserved, Then revocation does not release it. The operation runs to a terminal state (`REQ-OP-9`)."

[[acceptance]]
id = "AC-H1.1"
story = "US-H1"
epic = "H"
text = "Given an identity, Then balances across all its accounts and assets are returned as one result (`REQ-BA-5`)."

[[acceptance]]
id = "AC-H1.2"
story = "US-H1"
epic = "H"
text = "Given the result, Then `available` and `total` are both present, each with its own label. Both come from one consistent view (`REQ-BA-2`, `REQ-QR-2`)."

[[acceptance]]
id = "AC-H2.1"
story = "US-H2"
epic = "H"
text = "Given a movement list, Then it pages on the entry sequence, not on time (`REQ-PO-2`)."

[[acceptance]]
id = "AC-H2.2"
story = "US-H2"
epic = "H"
text = "Given a filter by account, asset, direction, counterparty or time range, Then aledgent applies it (`REQ-QR-1`)."

[[acceptance]]
id = "AC-H2.3"
story = "US-H2"
epic = "H"
text = "Given a movement, Then its status comes from its posting kind, never from parsing a string (`REQ-PO-1`)."

[[acceptance]]
id = "AC-H3.1"
story = "US-H3"
epic = "H"
text = "Given a period, Then opening balance plus movements equals closing balance exactly (`INV-6`)."

[[acceptance]]
id = "AC-H3.2"
story = "US-H3"
epic = "H"
text = "Given the same period is requested twice, Then the statement is identical (`REQ-QR-2`)."

[[acceptance]]
id = "AC-H4.1"
story = "US-H4"
epic = "H"
text = "Given any query, Then it has no effect on any ledger fact (`REQ-QR-3`)."

[[acceptance]]
id = "AC-H5.1"
story = "US-H5"
epic = "H"
text = "Given any entry against the account, Then I can see it, including one made under operator authority (`REQ-QR-4`, `INV-20`)."

[[acceptance]]
id = "AC-I1.1"
story = "US-I1"
epic = "I"
text = "Given the public record, Then it reveals no account, identity, balance, counterparty or internal movement (`REQ-PV-2`, `REQ-PR-2`)."

[[acceptance]]
id = "AC-I1.2"
story = "US-I1"
epic = "I"
text = "Given any read of a ledger fact, Then it is authorised against an authority over that fact's subject. A principal with no such authority can reach nothing of mine (`REQ-PV-1`, `INV-16`)."

[[acceptance]]
id = "AC-I4.1"
story = "US-I4"
epic = "I"
text = "Given any identifier or anchored value, Then it contains no personal data (`REQ-PV-3`, `INV-17`)."

[[acceptance]]
id = "AC-I4.2"
story = "US-I4"
epic = "I"
text = "Given an erasure request, Then meeting it does not require rewriting an identifier that other systems hold (`REQ-ID-1`)."

[[acceptance]]
id = "AC-J1.1"
story = "US-J1"
epic = "J"
text = "Given a bounded interval, Then a checkpoint is anchored (`REQ-PR-1`)."

[[acceptance]]
id = "AC-J1.2"
story = "US-J1"
epic = "J"
text = "Given an anchor, Then it commits to every entry up to and including a stated sequence, and to nothing else (`REQ-PR-7`)."

[[acceptance]]
id = "AC-J1.3"
story = "US-J1"
epic = "J"
text = "Given an anchor whose publication did not reach finality, Then it establishes nothing and is not cited (`REQ-PR-8`)."

[[acceptance]]
id = "AC-J1.4"
story = "US-J1"
epic = "J"
text = "Given anchoring is unavailable, Then holders' operations continue (`REQ-PR-9`)."

[[acceptance]]
id = "AC-J1.5"
story = "US-J1"
epic = "J"
text = "Given a checkpoint a disclosure rests on, Then it names the construction of its state commitment, and its anchor binds that name: the same checkpoint with another construction named does not match the anchor (`REQ-PR-10`)."

[[acceptance]]
id = "AC-J3.1"
story = "US-J3"
epic = "J"
text = "Given any day, Then the comparison has run and its result is recorded (`REQ-PR-5`, `NFR-9`)."

[[acceptance]]
id = "AC-J3.2"
story = "US-J3"
epic = "J"
text = "Given a difference of one minor unit, Then it is detected. Tolerance is zero (`NFR-9`)."

[[acceptance]]
id = "AC-K1.1"
story = "US-K1"
epic = "K"
text = "Given a `Needs-Review` operation, Then I can resolve it through an authenticated, audited operation (`REQ-AT-3`, `REQ-RC-1`)."

[[acceptance]]
id = "AC-K1.2"
story = "US-K1"
epic = "K"
text = "Given a resolution, Then it records who acted and why. No direct change to storage was needed or possible (`REQ-AT-1`, `REQ-AT-3`)."

[[acceptance]]
id = "AC-K1.3"
story = "US-K1"
epic = "K"
text = "Given a `Needs-Review` operation with an external leg, When one operator resolves it to `Released` without proof that the leg did not and cannot take effect, or to `Settled` without a final record that names the operation, Then the resolution is refused and the operation stays in `Needs-Review` (`REQ-RC-5`)."

[[acceptance]]
id = "AC-K1.4"
story = "US-K1"
epic = "K"
text = "Given a `Needs-Review` operation, When the settlement adapter reports records that prove its outcome, Then aledgent resolves it on that proof at once, with no human: `Settled` on a final record naming it, `Released` on a proved rejection or proven non-inclusion, or on an inbound arrival's record withdrawn from the canonical chain (`REQ-RC-5` step 1)."

[[acceptance]]
id = "AC-K1.5"
story = "US-K1"
epic = "K"
text = "Given a `Needs-Review` operation the adapter could not prove on its own, When one authority submits evidence, meaning a block and a transaction hash, Then nothing moves until the adapter has fetched and verified that evidence on its own. If the evidence proves the outcome, aledgent applies it with no second principal. The submission is audited like any operator action (`REQ-RC-5` step 2, `REQ-AT-3`)."

[[acceptance]]
id = "AC-K1.6"
story = "US-K1"
epic = "K"
text = "Given a `Needs-Review` operation whose submitted evidence the adapter checked and found no proof in, When a principal proposes releasing it without proof, Then nothing moves until a second, distinct principal agrees. Then it is released and an incident is raised. The same principal twice is `ERR-ApprovalRequired`. Before the adapter found no proof, the proposal is `ERR-EvidenceInsufficient`. A settlement of an external leg without proof is never made (`REQ-RC-5` step 3, `INV-10`)."

[[acceptance]]
id = "AC-K2.1"
story = "US-K2"
epic = "K"
text = "Given a finalised posting, When a reversal is proposed, Then it needs deliberate human approval and raises an incident (`REQ-RC-2`)."

[[acceptance]]
id = "AC-K2.2"
story = "US-K2"
epic = "K"
text = "Given a reversal, Then it is a new posting that references the original. It is never a mutation (`INV-2`, `REQ-PO-3`)."

[[acceptance]]
id = "AC-K2.3"
story = "US-K2"
epic = "K"
text = "Given a reversal whose posting does not mirror the reversed postings exactly and whole, Then it is refused, whoever approved it (`REQ-RC-5`, `REQ-PO-3`)."

[[acceptance]]
id = "AC-K3.1"
story = "US-K3"
epic = "K"
text = "Given a restart, Then for every operation the record states what was attempted, what happened, and whether every party owed a notification received one (`REQ-RT-4`, `REQ-SA-5`)."

[[acceptance]]
id = "AC-K3.2"
story = "US-K3"
epic = "K"
text = "Given an undelivered notification, Then it is redelivered under one identity (`REQ-EV-3`)."

[[acceptance]]
id = "AC-K4.1"
story = "US-K4"
epic = "K"
text = "Given a correction, Then it is submitted through the ordinary command surface, with idempotency and authority (`REQ-OP-11`, `REQ-AU-1`)."

[[acceptance]]
id = "AC-K4.2"
story = "US-K4"
epic = "K"
text = "Given a correction, Then it is a posting and is subject to every invariant in §9 (`INV-1`, `INV-2`)."

[[acceptance]]
id = "AC-K5.1"
story = "US-K5"
epic = "K"
text = "Given a restore from backup, Then every balance can be re-derived from entries alone. No acknowledged or decided operation is missing (`INV-6`, `NFR-4`, `NFR-10`)."

[[acceptance]]
id = "AC-K5.2"
story = "US-K5"
epic = "K"
text = "Given an export and a re-import, Then the observable state is identical (`REQ-RC-3`)."

[[acceptance]]
id = "AC-K6.1"
story = "US-K6"
epic = "K"
text = "Given a deployment under load, When I add execution nodes, Then its capacity grows with no change to the book, to any identifier in it or to any operation. Every balance is unchanged, and every command is acknowledged, answered and completed within its bound (`NFR-21` (a), `NFR-17`, `NFR-18`)."

[[acceptance]]
id = "AC-K6.2"
story = "US-K6"
epic = "K"
text = "Given a deployment under load, When I replace any execution node with a new one that starts with no local state, Then the new node is admitted online and brought up to date. No operation that was acknowledged or answered with its decision is missing, and every command is acknowledged, answered and completed within its bound (`NFR-21` (b), `NFR-4`, `NFR-5`)."

[[acceptance]]
id = "AC-K6.3"
story = "US-K6"
epic = "K"
text = "Given a deployment under load, When the local storage of any single execution node is destroyed at an arbitrary instant, Then no operation that was acknowledged or answered with its decision is missing, every balance re-derives from entries alone, and no restore from backup was needed (`NFR-21` (c), `NFR-4`, `INV-6`)."

[[acceptance]]
id = "AC-K7.1"
story = "US-K7"
epic = "K"
text = "Given an upgrade naming code version *H* from input *n*, When it is taken, Then every input before *n* keeps its outcome, every input from *n* runs under *H*, and the next checkpoint and its anchor name *H* (`REQ-RT-15`, `REQ-RT-16`)."

[[acceptance]]
id = "AC-K7.2"
story = "US-K7"
epic = "K"
text = "Given an upgrade naming a version whose artefacts no source returns, or returns with another digest, Then it is refused and the code does not change (`REQ-RT-16`, `REQ-RT-17`)."

[[acceptance]]
id = "AC-K7.3"
story = "US-K7"
epic = "K"
text = "Given an archived history that spans upgrades, When it is replayed from genesis under its code map, Then every writer reaches, at every input, the roots and the log it archived (`REQ-RT-3`, `REQ-RT-17`)."

[[acceptance]]
id = "AC-K7.4"
story = "US-K7"
epic = "K"
text = "Given a migration of construction at input *n*, Then checkpoints before *n* name the old construction and after it the new, the checkpoint at *n* carries both roots, and a proof against any anchor of either side checks (`REQ-PR-10`, `REQ-PR-11`)."

[[acceptance]]
id = "AC-K7.5"
story = "US-K7"
epic = "K"
text = "Given a new node, When it is brought up to date from the latest anchor-verified snapshot and the inputs since, or from genesis and every input, Then it reaches the same roots (`NFR-21` (b), `REQ-RT-17`)."

[[acceptance]]
id = "AC-K7.6"
story = "US-K7"
epic = "K"
text = "Given two builds of the same source with different build settings, Then they are two code versions with two digests, and moving between them is an upgrade (`REQ-RT-16`)."

[[acceptance]]
id = "AC-K7.7"
story = "US-K7"
epic = "K"
text = "Given a book whose genesis fixes the mode \"one principal\", When that principal changes the mode to \"a proposer and a different approver\", Then every later upgrade needs both, and the change is in the audit trail and in the next anchor (`REQ-RT-18`)."

[[acceptance]]
id = "AC-K7.8"
story = "US-K7"
epic = "K"
text = "Given a mode change that is not authorised under the mode in force, or that names a principal who does not exist, Then it is refused and the mode does not change (`REQ-RT-18`)."

[[acceptance]]
id = "AC-K7.9"
story = "US-K7"
epic = "K"
text = "Given an upgrade naming code version *H* from input *n*, When input *n* reaches a writer whose code is not of *H*'s code generation, Then it is refused, nothing changes, its number is not taken, and once the code is switched the same input runs under *H* (`REQ-RT-20`)."

[[acceptance]]
id = "AC-K7.10"
story = "US-K7"
epic = "K"
text = "Given a writer continued at input *n*, Then the book keeps its genesis and its construction, input *n*'s log entry chains to input *n* − 1's, the first writer takes no input from *n* once the founding record exists, and a replay from genesis crosses the boundary and reaches the archived roots and log at every input (`REQ-RT-21`, `REQ-RT-17`)."

[[acceptance]]
id = "AC-K7.11"
story = "US-K7"
epic = "K"
text = "Given a checkpoint, When a writer is restored from it under a code version that names a different platform than the one it was taken on, and the inputs after it are replayed, Then the writer reaches the checkpoint's roots and every archived root after it (`REQ-RT-19`)."

[[acceptance]]
id = "AC-K7.12"
story = "US-K7"
epic = "K"
text = "Given a writer fenced at input *n*, When an input that moves the upgrade to a later input or cancels it, authorised under the mode in force, reaches it, Then the old code takes it as input *n*; and When the writer stays fenced longer than the deployment's bound, Then an alert is raised (`REQ-RT-20`)."

[[acceptance]]
id = "AC-K7.13"
story = "US-K7"
epic = "K"
text = "Given an upgrade made to change only the runtime that executes a writer's code, Then the new code version still raises the code generation and carries it in its code's bytes, a writer whose switch was missed refuses input *n*, and an execution node whose runtime is not the one the current range's code version names refuses to drive the writer (`REQ-RT-20`)."

[[acceptance]]
id = "AC-K7.14"
story = "US-K7"
epic = "K"
text = "Given a continuation founded at input *n*, When a second founding at the same *n* with a different record is attempted, Then it is refused and nothing is founded; When a founding's writer state differs from the first writer's after *n* − 1 in any field that is not host-local, Then no record is written, nothing is founded, and a corrected founding can still be made; When a founding is retried after a crash and finds its own record, byte for byte, Then it resumes; When the next queued input moves or cancels the upgrade, Then no founding is made until the first writer has decided it; When a founding record exists, Then an input that moves or cancels the upgrade it was founded for is refused with `ERR-InvalidTransition`, its number is not taken, and the next input runs as *n* under *H*, while one that moves or cancels a later upgrade is taken; and When a log holds two founding records at one *n*, Then its replay is refused (`REQ-RT-21`)."

[[acceptance]]
id = "AC-K7.15"
story = "US-K7"
epic = "K"
text = "Given a range whose replayer the code archive holds, When the platform's execution of that range is checked with it, Then every input reaches its archived log hash; and When that replayer is replaced, Then no code version changes (`REQ-RT-19`)."

[[acceptance]]
id = "AC-K7.16"
story = "US-K7"
epic = "K"
text = "Given a writer whose generation in force is *g* + 1 after an upgrade, When code of generation *g* is installed again and an input reaches it, Then the input is refused and nothing changes; and Given an upgrade whose code version names a generation other than the writer's plus one, Then it is refused and nothing changes (`REQ-RT-20`)."

[[acceptance]]
id = "AC-K7.17"
story = "US-K7"
epic = "K"
text = "Given an upgrade scheduled from input *n*, When an input that moves or cancels it is not authorised under the mode in force, Then it is refused, nothing changes, and the upgrade stays scheduled (`REQ-RT-20`, `REQ-RT-18`)."

[[acceptance]]
id = "AC-K7.18"
story = "US-K7"
epic = "K"
text = "Given an upgrade scheduled from input *n* and an authorised input that moves or cancels it, arriving as input *n*, When it is decided by the old code, and When it is decided by the new code because the switch was already made, Then both commit the same outcome: the upgrade does not take effect at *n* and the generation stays the old one; and a replay assigns every input the generation the code map, read from the inputs alone, names (`REQ-RT-20`, `REQ-RT-17`)."

[[acceptance]]
id = "AC-K7.19"
story = "US-K7"
epic = "K"
text = "Given a logical writer whose input *n* is archived, When a second entry numbered *n* reaches the archive, Then it is refused; and Given an upgrade scheduled from *n*, When a move or cancellation committed at the first writer and a continuation's founding both claim *n*, Then whichever claims first stands and the other is refused, whether the first writer's entry reaches the archive before or after the continuation's first segment; When an entry at *n* reaches the archive from a continuation instance that is not the one recorded beside the founding record, or at an *n* whose claim is not a founding record, Then it is refused; and a log holding both is refused by replay (`REQ-RT-21`)."

[[acceptance]]
id = "AC-K7.20"
story = "US-K7"
epic = "K"
text = "Given a founding being made for an upgrade scheduled from *n*, When a move or cancellation of that upgrade commits at the first writer before the founding's checks, before or after the build, have passed, Then no founding record is written, nothing is founded, and the first writer continues (`REQ-RT-21`)."

[[acceptance]]
id = "AC-N1.1"
story = "US-N1"
epic = "N"
text = "Given a credential's public material from the prior system, of a kind the deployment accepts, When I import it into the holder's identity with a justification, Then it is a member of the identity's set, marked as imported. The import is audited, attributed to me, and shown to the identity's authority holders (`REQ-MG-7`, `REQ-AT-1`, `INV-20`)."

[[acceptance]]
id = "AC-N1.2"
story = "US-N1"
epic = "N"
text = "Given a credential of a kind the deployment does not accept, or one already in the set, When I import it, Then the import is refused with `ERR-CredentialInvalid` and nothing changes (`REQ-MG-7`)."

[[acceptance]]
id = "AC-N1.3"
story = "US-N1"
epic = "N"
text = "Given an identity with an account in owned custody, When I import into its set, Then the import is refused with `ERR-NotAuthorised` (`REQ-MG-8`)."

[[acceptance]]
id = "AC-N1.4"
story = "US-N1"
epic = "N"
text = "Given an imported credential, When the holder reclaims custody with it, Then the reclaim needs the credential's proof that it works, as for any other credential (`REQ-AU-13`, `REQ-MG-8`)."

[[acceptance]]
id = "AC-N2.1"
story = "US-N2"
epic = "N"
text = "Given a genesis that commits a seed, When the book is founded, Then its first state is the one the commands its records stand for would have made, and it is sealed (`REQ-RC-6`)."

[[acceptance]]
id = "AC-N2.2"
story = "US-N2"
epic = "N"
text = "Given a seeded book that is not sealed, When any command is submitted, Then it is refused with `ERR-InitialStateNotSealed` and nothing changes (`REQ-RC-6`)."

[[acceptance]]
id = "AC-N2.3"
story = "US-N2"
epic = "N"
text = "Given a part that is not the committed one at its position, or one already applied, When I apply it, Then it takes no effect: a part already applied answers as it did (`REQ-RC-6`, `INV-18`)."

[[acceptance]]
id = "AC-N2.4"
story = "US-N2"
epic = "N"
text = "Given a seeded book, When its first state is derived again from the seed, or a seeding in parts is interrupted and resumed, Then the book is the same (`REQ-RC-6`, `REQ-RT-3`)."

[[acceptance]]
id = "AC-N2.5"
story = "US-N2"
epic = "N"
text = "Given a seed whose opening balances do not reconcile with every required source, When I apply it, Then it is refused before any part takes effect (`REQ-RC-4`, `REQ-RC-6`)."

[[acceptance]]
id = "AC-M2.1"
story = "US-M2"
epic = "M"
text = "Given a terminal outcome, Then a notification is delivered at least once. It carries the operation reference and can be deduplicated (`REQ-EV-1`, `REQ-EV-3`)."

[[acceptance]]
id = "AC-M2.2"
story = "US-M2"
epic = "M"
text = "Given notifications for one operation, Then arrival order is not guaranteed. Each one carries enough to be understood on its own (`REQ-EV-2`)."

[[acceptance]]
id = "AC-M2.3"
story = "US-M2"
epic = "M"
text = "Given a notification, Then the recipient can verify its authenticity, and it cannot be replayed (`REQ-EV-4`)."

[[acceptance]]
id = "AC-M2.4"
story = "US-M2"
epic = "M"
text = "Given a notification, Then it names the latest anchor that was final when its transition was recorded, or says that none was. Every delivery of it names the same one (`REQ-EV-1`, `REQ-EV-3`)."

[[acceptance]]
id = "AC-M3.1"
story = "US-M3"
epic = "M"
text = "Given an operation, Then aledgent reaches its outcome and a terminal state without a synchronous call into any caller (`REQ-EV-5`)."

[[acceptance]]
id = "AC-M4.1"
story = "US-M4"
epic = "M"
text = "Given any account, Then the authoritative balance is aledgent's. Any copy I keep is a cache with no standing (`INV-8`)."

[[acceptance]]
id = "AC-M5.1"
story = "US-M5"
epic = "M"
text = "Given an account or security command (`REQ-CS-8`), When I send it, Then the reply carries its decision: the result, or the refusal named. It is never `Received`. If the decision cannot be made in time, the reply is `ERR-DecisionUnavailable`, and a retry with the same client key returns the decision (`REQ-CS-7`, `NFR-16`)."

[[acceptance]]
id = "AC-M6.1"
story = "US-M6"
epic = "M"
text = "Given my principal's answering setting says \"decided\", When it reserves or transfers, Then the reply carries the decision: `Reserved` or the transfer's terminal state, or the refusal named. It is never `Received` (`REQ-CS-9`, `NFR-16`)."

[[acceptance]]
id = "AC-M6.2"
story = "US-M6"
epic = "M"
text = "Given the decision is not made within the setting's wait, Then the reply is `ERR-DecisionUnavailable`. The command is decided later, its decision is notified, and a retry with the same client key returns it (`REQ-CS-9`, `REQ-CS-7`, `REQ-EV-1`)."

[[acceptance]]
id = "AC-M6.3"
story = "US-M6"
epic = "M"
text = "Given no setting, Then my principal's transfers and reservations are acknowledged at `Received`. Given the setting changes, Then a command taken in before the change is answered, and re-answered, as it was taken in (`REQ-CS-9`)."

[[acceptance]]
id = "AC-M6.4"
story = "US-M6"
epic = "M"
text = "Given a setting whose wait exceeds the bound of `REQ-CS-7`, When I set it, Then it is refused with `ERR-NotAuthorised` and the setting is unchanged (`REQ-CS-9`)."

[[acceptance]]
id = "AC-M7.1"
story = "US-M7"
epic = "M"
text = "Given a transfer, a capture, an issuance or a reversal that credits an account another principal serves, Then that account's serving principal receives a credit notification for it. The notification carries the account, asset, amount, posting kind, operation reference and latest final anchor (`REQ-EV-9`)."

[[acceptance]]
id = "AC-M7.2"
story = "US-M7"
epic = "M"
text = "Given a release of a reservation, or an opening, Then no credit notification is sent (`REQ-EV-9`)."

[[acceptance]]
id = "AC-M7.3"
story = "US-M7"
epic = "M"
text = "Given a credit to an account the requester also serves, Then the requester receives the transition notification and the credit notification, each with its own identity, and a redelivery of either carries the same identity (`REQ-EV-9`, `REQ-EV-3`)."

[[acceptance]]
id = "AC-M7.4"
story = "US-M7"
epic = "M"
text = "Given an account its own identity opened, Then its credit notifications reach the principal that opened that identity (`REQ-EV-9`)."

[[acceptance]]
id = "AC-M8.1"
story = "US-M8"
epic = "M"
text = "Given a command with pass-through data, Then its reply, `operation(reference)`, every notification of its transitions and its movements carry the same data (`REQ-PO-5`)."

[[acceptance]]
id = "AC-M8.2"
story = "US-M8"
epic = "M"
text = "Given a repeat under the same client key with different pass-through data, Then it is refused with `ERR-ClientKeyReused` (`REQ-PO-5`, `REQ-OP-10`)."

[[acceptance]]
id = "AC-M8.3"
story = "US-M8"
epic = "M"
text = "Given pass-through data over 1 KiB, or not one JSON value, Then the command is refused with `ERR-MalformedCommand` and nothing is taken in (`REQ-PO-5`, `REQ-ER-3`)."

[[acceptance]]
id = "AC-M8.4"
story = "US-M8"
epic = "M"
text = "Given another party's principal that reads a movement of the operation, or receives its credit notification, Then the pass-through data is not in what it reads (`REQ-PO-5`, `REQ-EV-9`)."
