[[invariant]]
id = "INV-1"
layers = ["kernel"]
v0 = ["kernel"]
text = "For every posting and every asset, debits equal credits. A single-legged posting cannot be expressed."

[[invariant]]
id = "INV-2"
layers = ["kernel", "store"]
v0 = ["kernel", "store"]
text = "The book is append-only. No committed entry or posting is ever changed or deleted. A correction is a new posting."

[[invariant]]
id = "INV-3"
layers = ["kernel"]
v0 = ["kernel"]
text = "A `Customer` account is never negative, in any asset or balance kind, at any instant, under any concurrency."

[[invariant]]
id = "INV-4"
layers = ["kernel"]
v0 = ["kernel"]
text = "Assets are kept separate within an account. No operation mixes the balances of two assets."

[[invariant]]
id = "INV-5"
layers = ["store"]
v0 = ["store"]
text = "Across the whole book, the signed sum of all entries for each asset is exactly zero."

[[invariant]]
id = "INV-6"
layers = ["store", "service"]
v0 = ["store", "service"]
text = "Every stored balance equals the sum of the entries that produced it. It can be re-derived from entries alone."

[[invariant]]
id = "INV-7"
layers = ["store", "type"]
v0 = ["store", "type"]
text = "Every monetary amount is an exact integer count of a registered asset's minor units, at every boundary."

[[invariant]]
id = "INV-8"
layers = ["service"]
v0 = ["service"]
text = "There is exactly one authoritative copy of every ledger fact, and it belongs to aledgent."

[[invariant]]
id = "INV-9"
layers = ["service"]
v0 = ["service"]
text = "An account that exists can be credited. No state exists in which an account exists and an inbound credit to it is discarded."

[[invariant]]
id = "INV-10"
layers = ["service"]
v0 = ["service"]
text = "No entry is written against the issuance counterparty for an external leg before that leg is final."

[[invariant]]
id = "INV-11"
layers = ["service"]
v0 = ["service"]
text = "No caller can assert an operation's outcome. aledgent derives every outcome from evidence it recorded."

[[invariant]]
id = "INV-12"
layers = ["store"]
v0 = ["store"]
text = "An observation coordinate is applied at most once, permanently."

[[invariant]]
id = "INV-13"
layers = ["service"]
v0 = ["service"]
text = "No external leg can execute on a path that has not reserved first."

[[invariant]]
id = "INV-14"
layers = ["service"]
v0 = ["service"]
text = "A reservation and its capture or release are the same object, matched by identity. An amount supplied by a confirming party never decides what is released."

[[invariant]]
id = "INV-15"
layers = ["store", "service"]
v0 = ["service"]
text = "No non-terminal operation exists without a deadline and a resolution path the operator can reach. Past its deadline, that path is `Needs-Review`."

[[invariant]]
id = "INV-16"
layers = ["store"]
v0 = ["service"]
text = "A principal cannot reach any ledger fact it holds no authority over."

[[invariant]]
id = "INV-17"
layers = ["store", "build-gate"]
v0 = ["store", "build-gate"]
text = "No identifier and no anchored value contains personal data."

[[invariant]]
id = "INV-18"
layers = ["store"]
v0 = ["store"]
text = "Every state transition is idempotent on (operation, from-state, to-state, evidence)."

[[invariant]]
id = "INV-19"
layers = ["service"]
v0 = ["service"]
text = "An anchor commits, at one consistent cut (`REQ-RT-14`), to every entry up to and including the cut's commit of each partition (`REQ-RT-9`), to the registry of identities, credentials and grants at the cut's version, to the audit trail up to the cut's sequence of each writer (`REQ-RT-13`), and to each writer's stream heads at the cut, and to nothing else."

[[invariant]]
id = "INV-20"
layers = ["service"]
v0 = ["service"]
text = "Every entry against an account is visible to that account's authority holders. The authority that caused it is recorded."

[[invariant]]
id = "INV-21"
layers = ["store"]
v0 = ["store"]
text = "Terminal operation states are absorbing. An operation never leaves a terminal state."

[[invariant]]
id = "INV-22"
layers = ["credential"]
v0 = ["service"]
text = "A credential cannot widen its own scope or change its own kind."

[[invariant]]
id = "INV-23"
layers = ["service"]
v0 = ["service"]
text = "A refusal by the accounting core is never, on its own, a terminal outcome for an operation whose external leg can be observed independently."

[[invariant]]
id = "INV-24"
layers = ["store"]
v0 = ["store"]
text = "There is exactly one asset registry. An asset's precision is recorded only there."

[[invariant]]
id = "INV-25"
layers = ["architecture"]
v0 = ["architecture"]
text = "A deployment has exactly one book. It is not split by asset, by account kind or by integrating party. Holding its state in partitions of accounts (`REQ-RT-9`) does not split it: one registry, one trial balance, one sequence of anchors."

