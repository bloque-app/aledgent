# cargo-nextest's settings for the `tests` job of .github/workflows/ci.yml. `cargo test` runs one
# binary at a time; nextest runs the tests of every binary in one pool, so a test that measures wall
# time now competes with tests of other binaries too.

# NFR-1: apply cost is flat to 1,000 postings. It asserts a ratio of two measured times (at 1,000
# postings against 100, within 3x), which a busy neighbour can break: it failed once, 4.4 ms against
# 1.4 ms, with the pool full. It takes every slot, so it runs alone.
[[profile.default.overrides]]
filter = 'package(ledger-kernel) & test(/book::cost_tests::/)'
threads-required = "num-cpus"
