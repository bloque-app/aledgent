# cargo-nextest's settings for the `tests` job of .github/workflows/ci.yml. `cargo test` runs one
# binary at a time; nextest runs the tests of every binary in one pool, so a test that measures wall
# time now competes with tests of other binaries too.

# Tests that race a clock, and lose when the pool is full. Each takes every slot, so it runs alone,
# as a binary of its own ran under `cargo test`.
# - NFR-1, apply cost flat to 1,000 postings: it asserts a ratio of two measured times (1,000
#   postings against 100, within 3x), and failed once, 4.4 ms against 1.4 ms, with the pool full.
# - REQ-RT-3, an on-disk core rebuilds from its journal: it reads the core's input count, stops
#   and restarts the core, and expects the same count, while the deployment's tasks run on; with
#   the pool full they journaled two inputs in between (9 against 7). The race is in the test.
[[profile.default.overrides]]
filter = '''
(package(ledger-kernel) & test(/book::cost_tests::/))
| (package(ingress) & binary(book_on_disk))
'''
threads-required = "num-cpus"

# The longest tests start first (measured on the run of 2026-10-30: 123 s, 56 s, 44 s, 33 s, 27 s and
# 25 s, the next is 20 s). The pool otherwise reached the 123 s one in the middle of the run, and the
# job waited for it alone. A list, not a rule: a test that grows past these belongs on it.
[[profile.default.overrides]]
filter = '''
test(=f_036_a_seed_chunk_in_the_guests_heap)
| test(=req_rt_1_a_grant_costs_the_same_however_many_grants_its_principal_holds)
| test(=inv_10_to_13_ten_thousand_seeded_histories_against_the_simulated_layer)
| test(=t043_07_the_heap_stays_flat_over_ten_thousand_incidents)
| test(=inv_18_ten_thousand_walks_applied_twice_change_nothing)
| test(=nfr_10_the_drill_restores_postgres_from_base_backup_and_wal_to_the_pre_failure_root)
'''
priority = 100
