# vos-core's guest configuration (pvm/guest/config.toml at 1650c474), with this crate's pvm.ld.
[target.riscv64em-vos]
rustflags = [
    "-Zunstable-options",
    "-Clink-arg=-Tpvm.ld",
]

[unstable]
json-target-spec = true
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
