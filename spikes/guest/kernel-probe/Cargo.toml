# F-002 S2/S3 guest: the kernel inside a VOS saga Agent actor. Never shipped.
# Built inside the Linux container by spikes/guest/build.sh with the VOS
# example actors' toolchain (nightly-2026-03-20 + rust-src, target riscv64em-vos).
# The VOS saga checkout (7bae926) is mounted at /vos.
[workspace]

[package]
name = "kernel-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/bloque-app/aledgent"

[features]
default = ["bin"]
bin = []
# S2 findings: does the kernel's `signing` build for the guest? Does the curve
# precompile build and run at 7bae926?
signing = ["cipher-clerk/signing"]
precompile = ["cipher-clerk/pvm-precompile"]

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_arch = "riscv64")'.dependencies]
vos = { path = "/vos/vos", default-features = false, features = ["macros", "pvm"] }

[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
vos = { path = "/vos/vos", default-features = false, features = ["macros", "extension"] }

[dependencies]
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", rev = "e9a7b0851f183c14dbd1635dbf0437c86682ad6f", default-features = false }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "little_endian", "pointer_width_32"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
