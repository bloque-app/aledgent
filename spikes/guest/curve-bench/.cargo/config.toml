# Same target, linker script and build as VOS's services/agent-runtime (F-025).
[target.riscv64em-vos]
rustflags = [
    "-Zunstable-options",
    "-Zcrate-attr=no_std",
    "-Zcrate-attr=no_main",
    "-Aduplicate-macro-attributes",
    "-Aunused-attributes",
    "-Clink-arg=-Tpvm.ld",
    "-Zremap-cwd-prefix=.",
]

[alias]
actor = "rustc --lib --crate-type bin -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem --release --target riscv64em-vos.json"

[unstable]
json-target-spec = true
