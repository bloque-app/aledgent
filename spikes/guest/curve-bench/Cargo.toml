# F-025 (T-025-02): the interpreted gas of each curve precompile operation as
# VOS's standard AgentRuntime computes it (same target, toolchain, profile and
# curve25519-dalek release). Measurement tool; never shipped. Its target spec and linker script are
# copied from VOS (AGPL-3.0-or-later).
[workspace]

[package]
name = "curve-bench"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/bloque-app/aledgent"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
curve25519-dalek = { version = "=4.1.3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
