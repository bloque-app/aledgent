[package]
name = "spikes-native"
version = "0.0.0"
description = "F-002 S1 (kernel, native) and S3 (witnessed leaves). Measurement code, never shipped."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The spikes measured and root the book in v1 (CipherClerk's full-depth trees): `IndexStore`'s model
# is v1, so FileStore must be too (DEC-25 made v2 the default; v1 is a supported opt-in, cs-q04).
ledger-kernel = { path = "../../crates/ledger-kernel", features = ["smt-v1"] }
# The same pin as the root workspace (F-001 §1). `signing` for the primitive
# benches; the experimental layers stay off (DEC-11).
cipher-clerk = { git = "https://codeberg.org/Virto/CipherClerk.git", rev = "e9a7b0851f183c14dbd1635dbf0437c86682ad6f", default-features = false, features = ["signing"] }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "little_endian", "pointer_width_32"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
tempfile = "3"
redb = "4"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "s1_apply"
harness = false

[lints]
workspace = true
